function verbs(){let r=ref(),i=Math.min(ui.verb||0,r.verbs.length-1),v=r.verbs[i];return v2head('THE ENGINE OF LANGUAGE','Verb atlas','Compare essential forms across people and tenses, then practice retrieving them.')+`<div class="card v2-card"><p>${e(r.intro)} ${state.lang==='ar'?'This table covers seven common person forms, not the full dual and plural gender paradigm.':'Learn regular patterns before memorizing irregular forms.'}</p><div class="button-row">${r.verbs.map((x,j)=>`<button class="btn ${i===j?'btn-primary':'btn-ghost'} btn-small" data-action="v2-verb" data-index="${j}">${e(x[0])}</button>`).join('')}</div><h2 style="margin-top:25px">${e(v[0])}</h2><div style="overflow:auto"><table class="word-table verb-table"><thead><tr><th>Person</th>${r.tenses.split('|').map(x=>`<th>${e(x)}</th>`).join('')}</tr></thead><tbody>${r.persons.split('|').map((p,j)=>`<tr><td>${e(p)}</td>${v.slice(1).map(col=>{let form=col.split('|')[j];return `<td><button class="verb-form" data-action="speak" data-text="${e(form)}">${target(form)} ${icon('sound')}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><button class="btn btn-primary" data-action="v2-drill" data-mode="verbs" style="margin-top:18px">Practice conjugation →</button></div>`;}
function rememberMistake(t,m){let key=t+' → '+m;let x=record().mistakes[key]||{target:t,english:m,count:0};x.count++;record().mistakes[key]=x;}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const strictNorm=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[’‘]/g,"'").replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[.,!?¿¡؟؛،…]/g,'').trim().replace(/\s+/g,' ');
function startDrill(mode){let pool=words(),r=record(),questions=[];if(mode==='mistakes'){pool=Object.values(r.mistakes).filter(x=>x&&typeof x.target==='string'&&typeof x.english==='string');if(!pool.length){toast('No mistakes saved yet. Try a mixed practice session.');return;}}else if(mode==='mixed'){let learned=pool.filter(x=>r.completed[x.unit]||x.unit===nextUnit());if(learned.length>=10)pool=learned;}if(mode==='grammar'){questions=shuffle(window.LUMI_GRAMMAR[state.lang]).map(([prompt,answer,a,b,c,explanation])=>({prompt,answer,options:shuffle([answer,a,b,c]),type:'choice',target:answer,english:prompt,explanation}));}else if(mode==='verbs'){let rr=ref();for(let v of rr.verbs){for(let t=0;t<3;t++){let forms=v[t+1].split('|');rr.persons.split('|').forEach((person,i)=>{let answer=forms[i],others=[...new Set(forms.filter(a=>strictNorm(a)!==strictNorm(answer)))];if(others.length>=2)questions.push({prompt:`${v[0]} · ${rr.tenses.split('|')[t]} · ${person}`,answer,options:shuffle([answer,...shuffle(others).slice(0,3)]),target:answer,english:`${v[0]} · ${rr.tenses.split('|')[t]} · ${person}`,type:'choice'});});}}questions=shuffle(questions).slice(0,12);}else{questions=shuffle(pool).slice(0,12).map((w,i)=>{let typing=mode==='write'||(mode==='mixed'&&i%3===1),listening=mode==='listen'||(mode==='mixed'&&i%3===2),answer=typing?w.target:w.english;let others=shuffle([...new Set(words().map(x=>x.english))].filter(x=>norm(x)!==norm(answer))).slice(0,3);return {target:w.target,english:w.english,prompt:typing?w.english:w.target,answer,options:typing?[]:shuffle([answer,...others]),type:typing?'type':listening?'listen':'choice'};});}ui.drill={mode,questions,index:0,score:0,graded:null,typed:'',done:false};ui.page='drill';ui.mobileOpen=false;window.scrollTo({top:0});render();}
function drill(){let d=ui.drill;if(!d)return v2head('ACTIVE RECALL','Practice arena','Work on a specific skill or challenge your memory. Mistakes become a personalized review queue.')+`<div class="v2-grid">${[['mixed','Mixed practice','Vocabulary from completed units and your next unit.'],['write','Type the translation','Produce target-language words; accents count.'],['listen','Listening challenge','Hear a phrase and identify its meaning.'],['verbs','Verb conjugation','Retrieve person and tense forms.'],['grammar','Grammar challenges','Apply rules to complete sentences, with explanations.'],['mistakes','Mistake repair',Object.keys(record().mistakes).length+' saved expressions to revisit.']].map(([id,title,desc])=>`<div class="card v2-card"><h2>${title}</h2><p>${desc}</p><button class="btn btn-primary btn-small" data-action="v2-drill" data-mode="${id}">Start practice →</button></div>`).join('')}</div><p class="footnote">Typing checks the model expression, not every possible valid translation. Arabic vowel marks are optional in typing practice; spelling and letters still matter.</p>`;if(d.done)return v2head('SESSION COMPLETE','Practice results',`${d.score} of ${d.questions.length} correct · ${Math.round(d.score/d.questions.length*100)}% accuracy`)+`<div class="card v2-card"><h2>${d.score===d.questions.length?'Perfect recall!':'Keep building your skills.'}</h2><p>Review difficult items and return tomorrow. Results are saved separately for ${current().name}.</p><div class="button-row"><button class="btn btn-primary" data-action="v2-drill" data-mode="${d.mode}">Practice again</button><button class="btn btn-ghost" data-nav="drill">Other skills</button></div></div>`;let q=d.questions[d.index],g=d.graded;return `<button class="back" data-nav="drill">← Back to practice arena</button>`+head('ACTIVE RECALL',q.type==='type'?'Write in '+current().name:q.type==='listen'?'Listen and choose':'Choose the correct answer',`Question ${d.index+1} of ${d.questions.length} · ${d.score} correct`)+`<div class="card v2-card drill-card"><div class="progress-bar"><span style="width:${d.index/d.questions.length*100}%"></span></div><div class="v2-example" style="margin:24px 0">${q.type==='listen'?playButton(q.target,'Play phrase'):q.type==='type'||['verbs','grammar'].includes(d.mode)?e(q.prompt):target(q.prompt)}</div>${q.type==='type'?`<label for="v2answer">Your translation</label><input id="v2answer" class="type-answer" ${state.lang==='ar'?'dir="rtl"':''} value="${e(d.typed)}" autocomplete="off" ${g?'disabled':''}><div class="button-row v2-keyboard">${(state.lang==='ar'?'ا أ إ آ ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ة ى ء ؤ ئ':state.lang==='fr'?'à â æ ç é è ê ë î ï ô œ ù û ü ÿ':'á é í ó ú ü ñ ¿ ¡').split(' ').map(ch=>`<button class="btn btn-ghost btn-small" data-action="v2-key" data-text="${ch}" ${g?'disabled':''}>${ch}</button>`).join('')}</div>${g?'':`<button class="btn btn-primary" data-action="v2-type">Check translation</button>`}`:`<div class="question-options">${q.options.map((o,i)=>`<button class="option ${g&&o===q.answer?'correct':''} ${g&&g.index===i&&!g.correct?'wrong':''}" data-action="v2-answer" data-index="${i}" ${g?'disabled':''}>${['verbs','grammar'].includes(d.mode)?target(o):e(o)}</button>`).join('')}</div>`}${g?`<div class="feedback ${g.correct?'':'bad'}"><strong>${g.correct?'Correct!':'Not quite. Model answer:'}</strong> ${e(q.answer)}${g.accent?' · Check accents/spelling.':''}${q.explanation?`<div style="margin-top:8px">${e(q.explanation)}</div>`:''}</div>${playButton(q.target,'Hear model')} <button class="btn btn-primary" data-action="v2-next">${d.index===d.questions.length-1?'Finish':'Next question'} →</button>`:''}</div>`;}
function gradeDrill(index){let d=ui.drill;if(!d||d.graded||d.done)return;let q=d.questions[d.index],a=q.type==='type'?d.typed:q.options[index];if(!a||!a.trim()){toast('Enter an answer first.');return;}let correct=q.type==='type'?strictNorm(a)===strictNorm(q.answer):a===q.answer,accent=!correct&&norm(a)===norm(q.answer);d.graded={correct,index,accent};record().answerCount++;if(correct){d.score++;record().correctCount++;let k=q.target+' → '+q.english;if(record().mistakes[k]){record().mistakes[k].count--;if(record().mistakes[k].count<=0)delete record().mistakes[k];}}else if(!['grammar','verbs'].includes(d.mode))rememberMistake(q.target,q.english);points(correct?10:2);render();}
function nextDrill(){let d=ui.drill;if(!d||!d.graded)return;d.index++;d.graded=null;d.typed='';if(d.index>=d.questions.length){d.done=true;record().drills++;points(10);}render();}
function journal(){let i=ui.prompt||0,entries=ref().writing,[name,prompt,model,check]=entries[i],text=record().journal[i]||'';return v2head('OUTPUT PRACTICE','Writing studio','Create your own sentences before revealing a model. Drafts are autosaved on this device.')+`<div class="card v2-card"><div class="button-row">${entries.map((x,j)=>`<button class="btn ${i===j?'btn-primary':'btn-ghost'} btn-small" data-action="v2-prompt" data-index="${j}">${e(x[0])}</button>`).join('')}</div><h2 style="margin-top:24px">${e(name)}</h2><p>${e(prompt)}</p><label for="v2journal">Your draft</label><textarea id="v2journal" lang="${state.lang}" dir="${current().direction}" placeholder="Write in ${current().name}…">${e(text)}</textarea><p class="metric-note">Autosaved as you type. Your writing is not sent to a server.</p><div class="button-row"><button class="btn btn-primary" data-action="v2-journal">Log writing practice</button><button class="btn btn-ghost" data-action="v2-model">${ui.model?'Hide':'Reveal'} model answer</button></div>${ui.model?`<div class="v2-example">${target(model)}</div>${playButton(model,'Hear model')}`:''}<div class="grammar-box" style="margin-top:20px"><strong>SELF-CHECK</strong><p>${e(check)} Read your draft aloud. Compare against the model, but remember that multiple correct versions exist.</p></div><p class="footnote">This studio gives model answers and a self-check rubric, not automated AI writing correction.</p></div>`;}
function saveJournal(){let i=ui.prompt||0,t=record().journal[i]||'';if(t.trim().length<5){toast('Write a few words first.');return;}let key='writing-'+i;if(record().skills[key]!==dkey()){record().skills[key]=dkey();points(10);}toast('Writing practice logged.');render();}

function audioDockInit(){let el=document.createElement('section');el.id='audioDock';el.className='audio-dock';el.hidden=true;el.setAttribute('aria-label','Audio player');el.innerHTML=`<div class="dock-main"><div class="dock-copy"><strong id="dockText"></strong><small id="dockStatus" role="status" aria-live="polite"></small></div><button class="btn btn-primary btn-small" data-action="audio-replay">Replay</button><button class="btn btn-ghost btn-small" data-action="audio-segment">Retry segment</button><button class="btn btn-ghost btn-small" data-action="voice-stop">Stop</button><label class="dock-rate">Speed <select id="dockSpeed" class="select"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.15">1.15×</option></select></label><button class="btn btn-ghost btn-small" data-action="audio-hide" aria-label="Close audio player">×</button></div><div class="dock-tools"><a id="dockExternal" target="_blank" rel="noopener noreferrer" title="Opens Google Translate with this course phrase">Alternate pronunciation ↗</a><label class="dock-link" for="referenceFile">Add reference audio</label><input type="file" id="referenceFile" accept="audio/*" hidden><button class="text-link" data-action="audio-delete">Remove reference</button><button class="text-link" data-nav="voiceLab">Speaking lab</button></div>`;document.body.appendChild(el);}
let mic=null,micStream=null,micURL=null,micBlob=null,micLang=null,micText='',micStatus='';
function stopMic(){if(mic&&mic.state!=='inactive')mic.stop();if(micStream)micStream.getTracks().forEach(t=>t.stop());}
function voiceLab(){let phrase=audioLang===state.lang&&audioText?audioText:current().units[nextUnit()].vocab[0][0];return v2head('LISTEN · IMITATE · COMPARE','Speaking lab','Build pronunciation through deliberate shadowing. Your practice recording is kept in memory and can be discarded.')+`<div class="card v2-card"><h2>1 · Listen to the model</h2><div class="v2-example">${target(phrase)}</div><div class="button-row">${playButton(phrase,'Hear model')}<button class="btn btn-ghost" data-action="v2-slow" data-text="${e(phrase)}">Slow model</button></div><h2 style="margin-top:24px">2 · Record yourself</h2><p>Repeat the phrase naturally. The microphone is used only after you press Record; Lumi does not upload this recording.</p><div class="button-row"><button class="btn btn-primary" data-action="mic-start" data-text="${e(phrase)}" ${mic&&mic.state!=='inactive'?'disabled':''}>Record</button><button class="btn btn-ghost" data-action="mic-stop">Stop recording</button><button class="btn btn-ghost" data-action="mic-discard">Discard</button></div><p id="micStatus" role="status">${e(micStatus)}</p>${micURL&&micLang===state.lang?`<audio controls src="${e(micURL)}" style="width:100%"></audio><p class="metric-note">Recorded phrase: ${e(micText)}</p><a class="btn btn-soft btn-small" href="${e(micURL)}" download="lumi-practice.${micBlob?.type.includes('mp4')?'m4a':micBlob?.type.includes('ogg')?'ogg':'webm'}">Save recording</a>`:''}<h2 style="margin-top:24px">3 · Compare and repeat</h2><p>Listen for rhythm, vowel length, consonant articulation, and stress. Do not treat speech recognition as a pronunciation score.</p><p class="footnote">Microphone access requires a supported browser and a secure context such as HTTPS. The alternate pronunciation link opens a separate service; recordings you add as references are stored locally in IndexedDB, not included in progress backups.</p></div>`;}
async function startMic(text){if(mic&&mic.state!=='inactive')return;stopAudio(true);try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Recording not supported');let lang=state.lang;micStatus='Requesting microphone permission…';render();let stream=await navigator.mediaDevices.getUserMedia({audio:true});if(ui.page!=='voiceLab'||state.lang!==lang){stream.getTracks().forEach(t=>t.stop());return;}micStream=stream;let rec=new MediaRecorder(stream),chunks=[];mic=rec;micLang=lang;micText=text;rec.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(mic!==rec)return;if(micURL)URL.revokeObjectURL(micURL);micBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});micURL=URL.createObjectURL(micBlob);micStatus='Recording ready. Listen and compare.';if(ui.page==='voiceLab')render();};rec.onerror=()=>{stopMic();micStatus='Recording failed.';if(ui.page==='voiceLab')render();};rec.start();micStatus='Recording… speak now.';render();setTimeout(()=>{if(mic===rec&&rec.state!=='inactive')stopMic();},60000);}catch(err){if(micStream)micStream.getTracks().forEach(t=>t.stop());micStatus='Microphone unavailable or permission denied.';if(ui.page==='voiceLab')render();}}
function discardMic(){stopMic();mic=null;if(micURL)URL.revokeObjectURL(micURL);micURL=null;micBlob=null;micStatus='Recording discarded.';render();}
function keepLesson(){if(!ui.lesson||ui.page!=='lesson')return;record().resume={lesson:{...ui.lesson},selected:ui.selected,typed:ui.typed,graded:ui.graded};save();}
function validResume(r){return r&&r.lesson&&Number.isInteger(r.lesson.unit)&&current().units[r.lesson.unit]&&Number.isInteger(r.lesson.stage)&&r.lesson.stage>=0&&r.lesson.stage<=10;}
function customDeck(){let list=record().custom||{};return v2head('YOUR OWN LANGUAGE','Personal vocabulary','Add words from your classes, books, conversations or daily life. They join your spaced-repetition deck.')+`<div class="card v2-card"><h2>Add an expression</h2><form id="customForm" class="custom-form"><label>Expression<input class="type-answer" id="customTarget" required maxlength="180" dir="${current().direction}" lang="${state.lang}"></label><label>English meaning<input class="type-answer" id="customMeaning" required maxlength="180"></label><label>Pronunciation or note (optional)<input class="type-answer" id="customPron" maxlength="180"></label><button class="btn btn-primary" type="submit">Add to review</button></form></div><div class="section-line"><h2>My expressions · ${Object.keys(list).length}</h2><button class="btn btn-soft btn-small" data-nav="review">Review now</button></div><div class="card v2-card">${Object.entries(list).map(([id,w])=>`<div class="custom-row"><div><strong>${target(w.target)}</strong><p>${e(w.english)}${w.pron?' · '+e(w.pron):''}</p></div><div class="button-row">${playButton(w.target)}<button class="btn btn-ghost btn-small" data-action="custom-remove" data-id="${e(id)}">Remove</button></div></div>`).join('')||'<p>No personal expressions yet.</p>'}</div>`;}
function addCustom(){let t=document.getElementById('customTarget').value.trim(),m=document.getElementById('customMeaning').value.trim(),p=document.getElementById('customPron').value.trim();if(!t||!m)return;if(Object.keys(record().custom).length>=500){toast('Personal deck limit is 500 entries per language.');return;}if(Object.values(record().custom).some(w=>strictNorm(w.target)===strictNorm(t)&&strictNorm(w.english)===strictNorm(m))){toast('That expression is already saved.');return;}let id='c-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);record().custom[id]={target:t,english:m,pron:p};record().reviews[id]={due:Date.now(),interval:0,ease:2.5,reps:0,last:null};save();render();toast('Added to Smart review.');}
function skillMap(){let r=record();return v2head('MEASURE WHAT YOU CAN DO','Skill checkpoints','Use these as personal evidence of progress, not an official CEFR assessment.')+`<div class="v2-grid">${Object.entries(CHECKPOINTS[state.lang]).map(([level,items])=>`<div class="card v2-card"><h2>${e(level)}</h2><p>${items.filter((_,i)=>r.skills['checkpoint-'+level+'-'+i]).length}/${items.length} self-assessed skills</p>${items.map((item,i)=>`<label class="check-skill"><input type="checkbox" data-checkpoint="${e(level+'-'+i)}" ${r.skills['checkpoint-'+level+'-'+i]?'checked':''}> <span>${e(item)}</span></label>`).join('')}<p class="metric-note">Mark only after demonstrating the skill without a model.</p></div>`).join('')}</div><div class="card v2-card" style="margin-top:18px"><h2>Next step</h2><p>Try a reading passage, speak for one minute without a script, and write a short paragraph. Compare your output with a fluent speaker or teacher.</p><div class="button-row"><button class="btn btn-soft" data-nav="read">Reading</button><button class="btn btn-soft" data-nav="voiceLab">Speaking</button><button class="btn btn-soft" data-nav="journal">Writing</button></div></div>`;}
const HANDBOOK={"fr": [["Sound and spelling", "French stress normally falls near the end of a rhythmic group. Many final consonants are silent, but not all. Nasal vowels require airflow through the nose without adding a separate n sound.", "un bon vin", "a good wine", "Do not pronounce every written final consonant or add an English n after a nasal vowel.", "Say or listen to bon, bonne, and vin. What changes?", "Bon and vin have nasal vowels; bonne has an oral vowel followed by n."], ["Liaison, elision and rhythm", "Liaison connects certain normally silent final consonants to an initial vowel sound. Elision replaces some final vowels with an apostrophe before a vowel or mute h.", "les amis / l’ami", "the friends / the friend", "Liaison is obligatory in some groups, forbidden in others, and optional in others. It is not universal.", "Why does le ami become l’ami?", "Le elides before the initial vowel sound in ami."], ["Articles and quantity", "Use le/la/les for specific or general classes, un/une/des for nonspecific count nouns, and du/de la/de l’ for nonspecific amounts. After many quantities and negation, use de.", "Je bois du café. Je ne bois pas de café.", "I drink coffee. I do not drink coffee.", "Do not use du after ordinary negation here. Être has different negation behavior.", "Translate: I would like some bread.", "Je voudrais du pain."], ["Pronoun placement", "Direct objects le/la/les and indirect objects lui/leur normally precede a finite verb, or precede the infinitive they belong to. Y often replaces a place or à + thing; en replaces de + thing or a quantity.", "Je lui parle. J’y vais. J’en veux.", "I speak to him/her. I go there. I want some.", "Do not use lui for a thing in every à phrase. Affirmative commands have different pronoun order.", "Replace à Marie in Je parle à Marie.", "Je lui parle."], ["Narrating the past", "Passé composé generally presents completed events or bounded actions; imparfait presents background, descriptions, habits or ongoing states. The same verb may occur in either tense depending on meaning.", "Il pleuvait quand je suis arrivé.", "It was raining when I arrived.", "Do not simply equate imparfait with all long actions and passé composé with short ones.", "Translate: I was reading when the phone rang.", "Je lisais quand le téléphone a sonné."], ["The subjunctive", "Use the subjunctive in many dependent clauses expressing necessity, desire, emotion or doubt, often after que. A different subject often motivates a subordinate clause.", "Il faut que tu viennes.", "You need to come.", "Que alone does not trigger the subjunctive. Je sais que normally takes indicative.", "Complete: Je veux que tu ___ (être) prêt.", "Je veux que tu sois prêt."], ["Hypotheses and politeness", "Si + present often combines with present, imperative or future. Si + imparfait normally combines with conditional for a hypothetical present/future. Conditional can also make polite requests.", "Si j’avais le temps, je voyagerais.", "If I had the time, I would travel.", "Do not put the conditional immediately after si in this construction.", "Translate: If I had money, I would buy a book.", "Si j’avais de l’argent, j’achèterais un livre."], ["Register and authentic conversation", "Tu is familiar and vous can be polite singular or plural. Spoken French often drops ne in casual negation, but retain it in formal writing.", "Vous pourriez m’aider, s’il vous plaît ?", "Could you help me, please?", "Do not assume every casual form is appropriate in academic or professional writing.", "Ask a stranger politely where the station is.", "Excusez-moi, où est la gare, s’il vous plaît ?"]], "ar": [["The writing system", "Arabic is written from right to left. Most letters connect to adjacent letters, but ا د ذ ر ز و cannot join to the next letter on their left. Short vowels may be written with marks; everyday text often omits them.", "كَتَبَ / كُتِبَ", "he wrote / it was written", "The same unvocalized consonants كتب can represent different words. Context and morphology matter.", "What changes the meaning in the two examples?", "The vowel pattern changes active kataba to passive kutiba."], ["Consonants and vowel length", "Distinguish ح from ه, ع from hamza, and emphatic consonants such as ص and ط from س and ت. Long vowels ا و ي can change meaning; shadda marks consonant doubling.", "قَلْب / كَلْب", "heart / dog", "Do not substitute English k for qāf in standard Arabic, or ignore long vowels. Dialect pronunciations vary.", "Compare عَلَم and عَالَم. What is different?", "The first is a flag; the second is a world. The second has a long ā."], ["Nominal sentences and definiteness", "A present-tense nominal sentence can have a subject and predicate without an overt verb meaning “to be.” ال marks definiteness. An adjective normally follows its noun and agrees in definiteness and gender.", "الْبَيْتُ كَبِيرٌ / الْبَيْتُ الْكَبِيرُ", "The house is big / the big house", "Repeating the definite article changes an adjective into part of the noun phrase here.", "Translate: The book is new.", "الْكِتَابُ جَدِيدٌ."], ["Possession and iḍāfa", "In an iḍāfa construction, two or more nouns express a relation such as possession. The first noun does not normally take ال or tanwīn; the following noun is genitive.", "كِتَابُ الطَّالِبِ", "the student’s book", "Do not write الْكِتَابُ الطَّالِبِ for this possessive construction.", "Translate: the door of the house.", "بَابُ الْبَيْتِ."], ["Gender, dual and plural agreement", "Arabic distinguishes singular, dual and plural. Human plurals generally take plural agreement; nonhuman plurals generally take feminine singular adjective agreement in standard Arabic.", "كُتُبٌ جَدِيدَةٌ", "new books", "Do not mechanically attach a plural adjective to every plural noun.", "Translate: new cars.", "سَيَّارَاتٌ جَدِيدَةٌ."], ["Roots and verb patterns", "Many Arabic words are formed from consonantal roots placed into patterns. The root ك ت ب relates to writing; different patterns express related but not always predictable meanings.", "كَتَبَ / كَاتِب / مَكْتَب / مَكْتُوب", "wrote / writer / office or desk / written", "A root is not a complete dictionary definition. Memorize actual words and usage, not only roots.", "Identify the common consonantal root.", "ك ت ب"], ["Verb mood and negation", "In standard Arabic, لم negates a past event using the jussive imperfect; لن negates a future event using the subjunctive imperfect. لا can negate ordinary present-tense verbs.", "لَمْ أَذْهَبْ / لَنْ أَذْهَبَ", "I did not go / I will not go", "Do not use a past-tense verb directly after لم. Mood endings may not be audible in ordinary unvocalized speech.", "Negate أَذْهَبُ for the future with لن.", "لَنْ أَذْهَبَ."], ["MSA and spoken Arabic", "Modern Standard Arabic (الفصحى) is widely used in formal writing, education, news, and formal speech. Everyday spoken dialects vary by region and may differ in vocabulary, sounds and grammar.", "كَيْفَ حَالُكَ؟", "How are you? (to a man, MSA)", "Do not assume learning MSA alone guarantees ease in every dialect conversation.", "What would you do to learn everyday conversation in a specific region?", "Choose a dialect and listen to fluent speakers from that region alongside MSA."]], "es": [["Sound, stress and accents", "Spanish words ending in a vowel, n or s normally stress the penultimate syllable; most other endings normally stress the last. Written accents mark exceptions and certain distinctions.", "público / publico / publicó", "public / I publish / he or she published", "Accent marks can change grammatical meaning, not just pronunciation.", "Which syllable is stressed in canción?", "The final syllable: -ción."], ["Ser and estar", "Ser commonly expresses identity, origin, characteristics and time. Estar commonly expresses location of people/things, states and results. The difference is not simply permanent versus temporary.", "La fiesta es aquí. Estoy aquí.", "The party is here. I am here.", "Events use ser for location; people and objects ordinarily use estar.", "Translate: The book is on the table.", "El libro está en la mesa."], ["Articles and personal a", "Articles agree in gender and number. The personal a precedes many specific human direct objects, even though the object remains direct.", "Veo a María. Veo la casa.", "I see María. I see the house.", "Do not automatically interpret a + person as an indirect object.", "Translate: I know your brother.", "Conozco a tu hermano."], ["Object pronouns and gustar", "Direct object pronouns include lo/la/los/las; indirect objects include le/les. Le or les becomes se before lo/la/los/las. Gustar agrees with the thing liked, while the experiencer is an indirect object.", "Me gustan los libros. Se lo doy.", "I like books. I give it to him/her/them.", "Do not conjugate gustar as if the person who likes something were its subject.", "Translate: I like this book.", "Me gusta este libro."], ["Preterite and imperfect", "The preterite presents a past event as complete or bounded; the imperfect describes background, habits or ongoing states. Both can describe the same event from different perspectives.", "Leía cuando sonó el teléfono.", "I was reading when the phone rang.", "Do not choose based only on how long the action lasted.", "Translate: I used to live in Madrid.", "Vivía en Madrid."], ["Por and para", "Para frequently expresses purpose, recipient, destination or deadline. Por frequently expresses cause, means, exchange, duration or movement through a place.", "Estudio para aprender. Gracias por ayudarme.", "I study in order to learn. Thanks for helping me.", "Do not translate all instances of English “for” with the same preposition.", "Translate: This gift is for you.", "Este regalo es para ti."], ["Subjunctive", "The subjunctive is used in many clauses expressing desire, doubt, emotion, necessity and certain nonasserted situations. It contrasts with the indicative for asserted facts.", "Quiero que vengas. Sé que vienes.", "I want you to come. I know you are coming.", "Que by itself does not require the subjunctive.", "Complete: Es importante que tú ___ (estudiar).", "Es importante que tú estudies."], ["Conditional and regional speech", "Si + imperfect subjunctive often pairs with conditional for hypothetical present/future situations. Spanish also varies regionally in pronouns and pronunciation, including tú, vos, usted, vosotros and ustedes.", "Si tuviera tiempo, viajaría.", "If I had time, I would travel.", "Do not use conditional directly after si in this pattern. Do not treat a regional variety as incorrect simply because it differs.", "Translate: If I could, I would go.", "Si pudiera, iría."]]};
function handbook(){return v2head('THE MECHANICS OF FLUENCY','Language handbook','A concept-first guide to difficult structures, with contrasts, pitfalls and retrieval practice.')+`<div class="v2-grid">${HANDBOOK[state.lang].map(([title,rule,example,english,trap,prompt,answer],i)=>`<article class="card v2-card"><div class="eyebrow">CHAPTER ${i+1}</div><h2>${e(title)}</h2><p>${e(rule)}</p><div class="v2-example">${target(example)}</div><p>${e(english)}</p>${playButton(example,'Hear example')}<div class="grammar-box" style="margin:15px 0"><strong>COMMON PITFALL</strong><p>${e(trap)}</p></div><h3 style="font-size:14px">Retrieve the idea</h3><p>${e(prompt)}</p><details><summary style="cursor:pointer;color:var(--violet);font-weight:700;font-size:13px">Reveal model answer</summary><p>${e(answer)}</p></details><button class="btn btn-soft btn-small" style="margin-top:15px" data-action="handbook-done" data-index="${i}">${record().skills['handbook-'+i]?'✓ Practiced':'Mark practiced'}</button></article>`).join('')}</div>`;}
const CHECKPOINTS={fr:{A1:['Introduce yourself and spell your name','Recognize French nasal vowels and common liaisons','Use articles and adjective agreement in simple descriptions','Ask and answer basic questions in the present'],A2:['Narrate a recent event using passé composé','Describe past habits using imparfait','Order a meal and ask for directions','Use direct and indirect object pronouns in short sentences'],B1:['Explain an opinion with a reason','Tell a story using both major past tenses','Use relative clauses with qui and que','Understand the main idea of a short news article'],B2:['Discuss hypothetical situations with si and conditional','Use common subjunctive triggers accurately','Write a structured argument with connectors','Follow a sustained conversation and respond spontaneously']},ar:{A1:['Read and connect all 28 letters in common forms','Distinguish short and long vowels and basic emphatic sounds','Introduce yourself using a nominal sentence','Use gender agreement and basic demonstratives'],A2:['Describe daily routines using present-tense verbs','Tell a short past-tense story','Use iḍāfa possession and basic prepositions','Ask and answer practical travel questions'],B1:['Recognize common derived verb patterns and roots','Use dual and plural forms with appropriate agreement','Understand main ideas in short MSA news passages','Explain a preference using connectors'],B2:['Use common subjunctive and jussive particles','Recognize case endings in vocalized text','Summarize an article in formal Arabic','Sustain a discussion in MSA and recognize that spoken dialects differ']},es:{A1:['Introduce yourself and pronounce stressed syllables','Use gender, number and article agreement','Distinguish basic uses of ser and estar','Ask simple present-tense questions'],A2:['Use preterite for completed events','Describe past habits with imperfect','Use common object pronouns','Navigate everyday shopping and travel situations'],B1:['Tell a connected story using contrasting past tenses','Explain preferences using por and para appropriately','Use common present-subjunctive triggers','Understand the main idea of a short authentic article'],B2:['Discuss hypothetical situations using si clauses','Use imperfect subjunctive in common contexts','Write a structured opinion with connectors','Follow a sustained conversation across unfamiliar topics']}};
function dailyAllocation(){let focus=state.focusLang||state.lang,mins=state.studyMinutes||30,primary=Math.ceil(mins/2),others=LANG_KEYS.filter(l=>l!==focus),alloc={[focus]:primary,[others[0]]:Math.floor((mins-primary)/2),[others[1]]:Math.ceil((mins-primary)/2)};return {focus,mins,alloc};}

 document.addEventListener('submit',ev=>{if(ev.target.id==='customForm'){ev.preventDefault();addCustom();}});
 document.addEventListener('change',async ev=>{let el=ev.target;if(el.id==='dockSpeed'){audioSpeed=Number(el.value);if(audioPlaying)startAudio(true);else paintAudio();}if(el.id==='studyMinutes'){state.studyMinutes=Number(el.value);save();render();}if(el.dataset.checkpoint){record().skills['checkpoint-'+el.dataset.checkpoint]=el.checked;save();render();}if(el.id==='referenceFile'&&el.files[0]){let f=el.files[0],key=clipKey(audioLang,audioText);el.value='';if(f.size>20*1024*1024||!f.type.startsWith('audio/')){toast('Choose an audio file up to 20 MB.');return;}try{await clipOp('put',key,f);toast('Reference saved for this exact phrase. Press Replay.');}catch{toast('Could not save audio on this device.');}}});
// Event delegation keeps dynamic screens reliable, even after navigation.
document.addEventListener('click',event=>{
 const nav=event.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return;}
 const lng=event.target.closest('[data-lang]');if(lng){if(ui.page==='routine')state.focusLang=lng.dataset.lang;setLanguage(lng.dataset.lang);return;}
 const el=event.target.closest('[data-action]');if(!el)return;
 const {action}=el.dataset;
 switch(action){
  case 'handbook-done':{let k='handbook-'+el.dataset.index;if(!record().skills[k]){record().skills[k]=dkey();points(5);render();}break;}
  case 'audio-replay':startAudio(false);break;
  case 'audio-segment':if(audioPart>=audioParts.length)audioPart=Math.max(0,audioParts.length-1);startAudio(true);break;
  case 'audio-hide':stopAudio();audioText='';paintAudio();break;
  case 'audio-delete':if(audioText)clipOp('delete',clipKey(audioLang,audioText)).then(()=>toast('Reference removed.')).catch(()=>toast('Could not remove reference.'));break;
  case 'mic-start':startMic(el.dataset.text);break;
  case 'mic-stop':stopMic();break;
  case 'mic-discard':discardMic();break;
  case 'custom-remove':delete record().custom[el.dataset.id];delete record().reviews[el.dataset.id];save();render();break;
  case 'v2-language':if(!state.focusLang)state.focusLang=state.lang;setLanguage(el.dataset.langkey);go(el.dataset.destination);break;
  case 'v2-drill':startDrill(el.dataset.mode);break;
  case 'v2-answer':gradeDrill(Number(el.dataset.index));break;
  case 'v2-type':gradeDrill();break;
  case 'v2-key':{let input=document.getElementById('v2answer');if(input&&!ui.drill.graded){let a=input.selectionStart,b=input.selectionEnd;input.setRangeText(el.dataset.text,a,b,'end');ui.drill.typed=input.value;input.focus();}break;}
  case 'v2-next':nextDrill();break;
  case 'v2-journal':saveJournal();break;
  case 'v2-prompt':ui.prompt=Number(el.dataset.index);ui.model=false;render();break;
  case 'v2-model':ui.model=!ui.model;render();break;
  case 'v2-verb':ui.verb=Number(el.dataset.index);render();break;
  case 'v2-slow':speakSlow(el.dataset.text);break;
  case 'v2-sound-done':record().skills.sounds=dkey();points(5);render();break;
  case 'menu':ui.mobileOpen=!ui.mobileOpen;renderSidebar();break;
  case 'speak':speak(el.dataset.text);break;
  case 'voice-stop':stopAudio(true);break;
  case 'voice-refresh':refreshVoicePanel();audioStatus('Voice list refreshed.');break;
  case 'start-lesson':startLesson(el.dataset.unit);break;
  case 'lesson-next':advanceLesson();break;
  case 'lesson-choice':if(!ui.graded){ui.selected=Number(el.dataset.index);keepLesson();render();}break;
  case 'lesson-check':checkLesson();break;
  case 'recognize':recognize();break;
  case 'speech-done':if(!ui.graded)scoreAnswer(true,'Self-reported speaking practice; pronunciation was not automatically verified.');break;
  case 'add-unit':introduceUnit(Number(el.dataset.unit));toast('All 10 expressions added to Smart review.');render();break;
  case 'flip-card':ui.reviewRevealed=true;render();break;
  case 'rate':rate(el.dataset.rating);break;
  case 'open-story':openStory(el.dataset.index);break;
  case 'story-answer':answerStory(el.dataset.index);break;
  case 'toggle-translation':ui.translation=!ui.translation;render();break;
  case 'open-dialogue':openDialogue(el.dataset.index);break;
  case 'dialogue-answer':dialogueAnswer(Number(el.dataset.index));break;
  case 'toggle-card':setCard(el.dataset.id);break;
  case 'add-filtered':addFiltered();break;
  case 'toggle-theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;
  case 'export':exportData();break;
  case 'reset':resetModal();break;
  case 'modal-close':closeModal();break;
  case 'reset-confirm':stopAudio();stopMic();ui.lesson=null;state=makeState();for(let l of LANG_KEYS)LANGS[l].units[0].vocab.forEach((w,i)=>state.langs[l].reviews[`0-${i}`]={due:Date.now(),interval:0,ease:2.5,reps:0,last:null});save();closeModal();go('dashboard');toast('Local progress has been reset.');break;
 }
});
document.addEventListener('input',event=>{if(event.target.id==='v2answer')ui.drill.typed=event.target.value;if(event.target.id==='v2journal'){record().journal[String(ui.prompt||0)]=event.target.value;save();}if(event.target.id==='answerInput'){ui.typed=event.target.value;keepLesson();}if(event.target.id==='dictionarySearch'){let start=event.target.selectionStart;ui.search=event.target.value;let section=document.getElementById('screen');section.innerHTML=wordbank();let newInput=document.getElementById('dictionarySearch');newInput.focus();newInput.setSelectionRange(start,start);}if(event.target.id==='goalSlider'){state.dailyGoal=Number(event.target.value);document.getElementById('goalNumber').textContent=state.dailyGoal+' XP';save();}});
document.addEventListener('change',event=>{if(event.target.id==='unitFilter'){ui.wordUnit=event.target.value;render();}if(event.target.id==='prefLang')setLanguage(event.target.value);if(event.target.id==='voiceChoice'){stopAudio();voicePrefs[state.lang]=event.target.value;try{localStorage.setItem(voicePrefsKey,JSON.stringify(voicePrefs));}catch{}refreshVoicePanel();audioStatus('Voice preference updated.');}if(event.target.id==='importFile')importData(event.target.files[0]);});
document.addEventListener('keydown',event=>{let tag=(event.target.tagName||'').toLowerCase();if(event.key==='Enter'&&event.target.id==='v2answer'){gradeDrill();return;}if(event.key==='Enter'&&event.target.id==='answerInput'){checkLesson();return;}if(['input','textarea','select'].includes(tag)||event.altKey||event.ctrlKey||event.metaKey)return;if(ui.page==='review'&&event.code==='Space'){event.preventDefault();ui.reviewRevealed=true;render();return;}if(ui.page==='review'&&ui.reviewRevealed&&['1','2','3','4'].includes(event.key)){rate(['again','hard','good','easy'][Number(event.key)-1]);return;}if(event.key==='Enter'&&event.target.classList.contains('flashcard')){ui.reviewRevealed=true;render();}});
document.addEventListener('click',event=>{if(event.target.classList.contains('modal-backdrop'))closeModal();});
// Single-file GitHub Pages edition: no service-worker dependency.
audioDockInit();render();
})();

  </script>
