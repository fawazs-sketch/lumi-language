const expansion={"fr": [{"id": "v2-0", "title": "Everyday routines", "sub": "Describe habits and frequency", "level": "A2", "icon": "book", "vocab": [["se réveiller", "to wake up"], ["se lever", "to get up"], ["se doucher", "to shower"], ["s’habiller", "to get dressed"], ["se coucher", "to go to bed"], ["tôt", "early"], ["tard", "late"], ["d’habitude", "usually"], ["chaque matin", "every morning"], ["rarement", "rarely"]], "grammar": ["Reflexive verbs", "Reflexive pronouns change with the subject: je me, tu te, il se, nous nous, vous vous, ils se. With negation, ne precedes the pronoun and pas follows the verb.", "Je me lève à sept heures.", "I get up at seven."]}, {"id": "v2-1", "title": "Past experiences", "sub": "Tell someone what happened", "level": "A2", "icon": "book", "vocab": [["j’ai vu", "I saw"], ["j’ai fait", "I did"], ["j’ai acheté", "I bought"], ["j’ai pris", "I took"], ["je suis allé", "I went (male speaker)"], ["je suis rentrée", "I returned home (female speaker)"], ["la veille", "the day before"], ["la semaine dernière", "last week"], ["une fois", "once"], ["déjà", "already"]], "grammar": ["Passé composé", "Use present avoir or être plus a past participle. Most verbs use avoir; many movement verbs and reflexives use être, with subject agreement in basic être constructions: elle est partie.", "Hier, j’ai acheté un livre.", "Yesterday I bought a book."]}, {"id": "v2-2", "title": "Future and plans", "sub": "Make plans and predictions", "level": "A2", "icon": "book", "vocab": [["bientôt", "soon"], ["plus tard", "later"], ["le mois prochain", "next month"], ["prévoir", "to plan"], ["espérer", "to hope"], ["promettre", "to promise"], ["annuler", "to cancel"], ["un projet", "a plan"], ["je serai", "I will be"], ["je ferai", "I will do"]], "grammar": ["Futur proche and simple", "Use aller + infinitive for planned or imminent events: je vais partir. The simple future generally uses the infinitive stem plus -ai, -as, -a, -ons, -ez, -ont; être becomes ser-, avoir aur-.", "Nous allons voyager demain.", "We are going to travel tomorrow."]}, {"id": "v2-3", "title": "Health and appointments", "sub": "Explain symptoms and make appointments", "level": "A2", "icon": "book", "vocab": [["un rendez-vous", "appointment"], ["la douleur", "pain"], ["la fièvre", "fever"], ["la toux", "cough"], ["le dos", "back"], ["la gorge", "throat"], ["une ordonnance", "prescription"], ["une pharmacie", "pharmacy"], ["se reposer", "to rest"], ["un médecin", "doctor"]], "grammar": ["Avoir mal and obligation", "Use avoir mal à + body part: au dos, à la tête, aux dents. Devoir + infinitive expresses obligation; il faut + infinitive gives general necessity.", "J’ai mal à la tête.", "I have a headache."]}, {"id": "v2-4", "title": "Shopping and comparisons", "sub": "Compare options and negotiate", "level": "B1", "icon": "book", "vocab": [["un prix", "price"], ["une réduction", "discount"], ["une taille", "size"], ["essayer", "to try on"], ["cher", "expensive"], ["bon marché", "inexpensive"], ["une caisse", "checkout"], ["un reçu", "receipt"], ["échanger", "to exchange"], ["la qualité", "quality"]], "grammar": ["Comparatives and superlatives", "Use plus, moins or aussi + adjective + que. Use le/la/les plus for the superlative. Bon becomes meilleur; bien becomes mieux.", "Ce manteau est moins cher que l’autre.", "This coat is less expensive than the other one."]}, {"id": "v2-5", "title": "Work and study", "sub": "Describe responsibilities and skills", "level": "B1", "icon": "book", "vocab": [["un entretien", "interview"], ["une candidature", "application"], ["une compétence", "skill"], ["un collègue", "colleague"], ["une réunion", "meeting"], ["un délai", "deadline"], ["un stage", "internship"], ["réussir", "to succeed"], ["un devoir", "assignment"], ["une recherche", "research"]], "grammar": ["Direct and indirect objects", "Direct object pronouns le, la, les replace a direct object. Lui and leur replace many à + person objects. They generally come before the conjugated verb: je lui parle.", "Je lui envoie un message.", "I send him or her a message."]}, {"id": "v2-6", "title": "Memories and storytelling", "sub": "Set the scene and narrate events", "level": "B1", "icon": "book", "vocab": [["autrefois", "formerly"], ["pendant que", "while"], ["tout à coup", "suddenly"], ["à cette époque", "at that time"], ["un souvenir", "a memory"], ["se souvenir", "to remember"], ["grandir", "to grow up"], ["une enfance", "childhood"], ["au début", "at first"], ["finalement", "finally"]], "grammar": ["Imparfait versus passé composé", "The imparfait describes background, ongoing states and repeated past habits. The passé composé presents bounded events. From nous parlons take parl- and add -ais, -ais, -ait, -ions, -iez, -aient.", "Il pleuvait quand je suis arrivé.", "It was raining when I arrived (male speaker)."]}, {"id": "v2-7", "title": "Advice and requests", "sub": "Speak politely and solve problems", "level": "B1", "icon": "book", "vocab": [["un conseil", "advice"], ["conseiller", "to advise"], ["une solution", "solution"], ["un problème", "problem"], ["il faudrait", "it would be necessary"], ["je pourrais", "I could"], ["je souhaiterais", "I would like"], ["suggérer", "to suggest"], ["une demande", "request"], ["en cas de", "in case of"]], "grammar": ["Conditional for politeness", "The conditional uses the future stem plus imparfait endings. Je voudrais is softer than je veux; vous pourriez is a polite request. Si + imparfait can introduce a hypothetical conditional.", "Vous pourriez m’aider ?", "Could you help me?"]}, {"id": "v2-8", "title": "Opinions and relationships", "sub": "Express attitudes and connect ideas", "level": "B1", "icon": "book", "vocab": [["à mon avis", "in my opinion"], ["être d’accord", "to agree"], ["désapprouver", "to disapprove"], ["une relation", "relationship"], ["la confiance", "trust"], ["un débat", "debate"], ["un avis", "opinion"], ["en revanche", "on the other hand"], ["pourtant", "however"], ["selon", "according to"]], "grammar": ["Relative pronouns", "Qui is a subject relative pronoun; que is a direct object relative pronoun; où refers to place or time. Dont replaces many de-complements: le livre dont je parle.", "C’est le livre que je lis.", "It is the book that I am reading."]}, {"id": "v2-9", "title": "News and society", "sub": "Summarize and report information", "level": "B2", "icon": "book", "vocab": [["un article", "article"], ["une source", "source"], ["un reportage", "report"], ["un témoignage", "testimony"], ["une enquête", "investigation"], ["une preuve", "evidence"], ["annoncer", "to announce"], ["affirmer", "to assert"], ["selon les médias", "according to the media"], ["un enjeu", "issue"]], "grammar": ["Reported speech", "In reported statements use dire que; in yes/no questions use demander si. When the reporting verb is past, tense may shift: il dit « je viens » → il a dit qu’il venait.", "Elle a dit qu’elle était prête.", "She said that she was ready."]}, {"id": "v2-10", "title": "Uncertainty and possibility", "sub": "Discuss wishes and hypothetical situations", "level": "B2", "icon": "book", "vocab": [["une hypothèse", "hypothesis"], ["un doute", "doubt"], ["une possibilité", "possibility"], ["un souhait", "wish"], ["pourvu que", "provided that"], ["bien que", "although"], ["il se peut que", "it may be that"], ["à moins que", "unless"], ["incertain", "uncertain"], ["probable", "likely"]], "grammar": ["Subjunctive", "Use the subjunctive after expressions of necessity, desire or doubt: il faut que, je veux que, je doute que. Common forms: que je sois, que j’aie, que je fasse. Je pense que normally takes indicative in an affirmative statement.", "Il faut que tu sois prudent.", "You need to be careful."]}, {"id": "v2-11", "title": "Formal communication", "sub": "Build clear arguments and formal writing", "level": "B2", "icon": "book", "vocab": [["néanmoins", "nevertheless"], ["en outre", "furthermore"], ["par conséquent", "therefore"], ["dans l’ensemble", "overall"], ["un argument", "argument"], ["une conclusion", "conclusion"], ["une approche", "approach"], ["une conséquence", "consequence"], ["une amélioration", "improvement"], ["cordialement", "kind regards"]], "grammar": ["Passive voice and argument structure", "The passive uses être + past participle agreeing with the subject: les lettres sont envoyées. Prefer active voice when the actor matters. Organize arguments with d’abord, en outre, cependant and par conséquent.", "Le rapport a été publié hier.", "The report was published yesterday."]}], "es": [{"id": "v2-0", "title": "Everyday routines", "sub": "Describe habits and frequency", "level": "A2", "icon": "book", "vocab": [["despertarse", "to wake up"], ["levantarse", "to get up"], ["ducharse", "to shower"], ["vestirse", "to get dressed"], ["acostarse", "to go to bed"], ["temprano", "early"], ["tarde", "late"], ["normalmente", "usually"], ["cada mañana", "every morning"], ["rara vez", "rarely"]], "grammar": ["Reflexive verbs", "Use me, te, se, nos, os, se with reflexive verbs. Place the pronoun before a conjugated verb: me levanto, te levantas. With an infinitive it may attach: voy a levantarme.", "Me levanto a las siete.", "I get up at seven."]}, {"id": "v2-1", "title": "Past experiences", "sub": "Tell someone what happened", "level": "A2", "icon": "book", "vocab": [["vi", "I saw"], ["hice", "I did"], ["compré", "I bought"], ["tomé", "I took"], ["fui", "I went"], ["volví", "I returned"], ["anoche", "last night"], ["la semana pasada", "last week"], ["una vez", "once"], ["ya", "already"]], "grammar": ["Preterite", "Regular -ar verbs use -é, -aste, -ó, -amos, -asteis, -aron. Regular -er/-ir use -í, -iste, -ió, -imos, -isteis, -ieron. Use it for bounded past events; common irregulars include fui and hice.", "Ayer compré un libro.", "Yesterday I bought a book."]}, {"id": "v2-2", "title": "Future and plans", "sub": "Make plans and predictions", "level": "A2", "icon": "book", "vocab": [["pronto", "soon"], ["más tarde", "later"], ["el próximo mes", "next month"], ["planear", "to plan"], ["esperar", "to hope"], ["prometer", "to promise"], ["cancelar", "to cancel"], ["un plan", "a plan"], ["seré", "I will be"], ["haré", "I will do"]], "grammar": ["Ir a and future", "Use ir a + infinitive: voy a estudiar. The simple future adds -é, -ás, -á, -emos, -éis, -án to the infinitive; common irregular stems include tendr-, har- and podr-.", "Vamos a viajar mañana.", "We are going to travel tomorrow."]}, {"id": "v2-3", "title": "Health and appointments", "sub": "Explain symptoms and make appointments", "level": "A2", "icon": "book", "vocab": [["una cita", "appointment"], ["el dolor", "pain"], ["la fiebre", "fever"], ["la tos", "cough"], ["la espalda", "back"], ["la garganta", "throat"], ["una receta", "prescription"], ["una farmacia", "pharmacy"], ["descansar", "to rest"], ["un médico", "doctor"]], "grammar": ["Doler and tener que", "Doler behaves like gustar: me duele la cabeza, me duelen los pies. The thing that hurts controls agreement. Tener que + infinitive expresses obligation.", "Me duele la cabeza.", "I have a headache."]}, {"id": "v2-4", "title": "Shopping and comparisons", "sub": "Compare options and negotiate", "level": "B1", "icon": "book", "vocab": [["un precio", "price"], ["un descuento", "discount"], ["una talla", "size"], ["probarse", "to try on"], ["caro", "expensive"], ["barato", "inexpensive"], ["una caja", "checkout"], ["un recibo", "receipt"], ["cambiar", "to exchange"], ["la calidad", "quality"]], "grammar": ["Comparatives and superlatives", "Use más/menos + adjective + que, or tan + adjective + como. Use el/la más for superlatives. Bueno becomes mejor and malo becomes peor in ordinary comparisons.", "Este abrigo es menos caro que el otro.", "This coat is less expensive than the other one."]}, {"id": "v2-5", "title": "Work and study", "sub": "Describe responsibilities and skills", "level": "B1", "icon": "book", "vocab": [["una entrevista", "interview"], ["una solicitud", "application"], ["una habilidad", "skill"], ["un compañero", "colleague"], ["una reunión", "meeting"], ["un plazo", "deadline"], ["unas prácticas", "internship"], ["tener éxito", "to succeed"], ["una tarea", "assignment"], ["una investigación", "research"]], "grammar": ["Object pronouns", "Direct objects use lo, la, los, las; indirect objects use le, les. Before lo/la/los/las, le/les become se: se lo envío. Regional leísmo exists, but this is the general standard pattern.", "Le envío un mensaje.", "I send him or her a message."]}, {"id": "v2-6", "title": "Memories and storytelling", "sub": "Set the scene and narrate events", "level": "B1", "icon": "book", "vocab": [["antes", "formerly"], ["mientras", "while"], ["de repente", "suddenly"], ["en aquella época", "at that time"], ["un recuerdo", "a memory"], ["recordar", "to remember"], ["crecer", "to grow up"], ["la infancia", "childhood"], ["al principio", "at first"], ["finalmente", "finally"]], "grammar": ["Imperfect versus preterite", "Use imperfect for background, repeated habits and ongoing past states; use preterite for bounded events. Regular imperfect endings are -aba for -ar and -ía for -er/-ir in first and third singular.", "Llovía cuando llegué.", "It was raining when I arrived."]}, {"id": "v2-7", "title": "Advice and requests", "sub": "Speak politely and solve problems", "level": "B1", "icon": "book", "vocab": [["un consejo", "advice"], ["aconsejar", "to advise"], ["una solución", "solution"], ["un problema", "problem"], ["habría que", "it would be necessary"], ["podría", "I could"], ["me gustaría", "I would like"], ["sugerir", "to suggest"], ["una petición", "request"], ["en caso de", "in case of"]], "grammar": ["Conditional for politeness", "Add -ía, -ías, -ía, -íamos, -íais, -ían to the future stem. Quisiera (imperfect subjunctive) and me gustaría (conditional) soften requests. Use podría for could.", "¿Podría ayudarme?", "Could you help me?"]}, {"id": "v2-8", "title": "Opinions and relationships", "sub": "Express attitudes and connect ideas", "level": "B1", "icon": "book", "vocab": [["en mi opinión", "in my opinion"], ["estar de acuerdo", "to agree"], ["desaprobar", "to disapprove"], ["una relación", "relationship"], ["la confianza", "trust"], ["un debate", "debate"], ["una opinión", "opinion"], ["en cambio", "on the other hand"], ["sin embargo", "however"], ["según", "according to"]], "grammar": ["Relative pronouns", "Que can be subject or object; quien often refers to people after a preposition or in nonrestrictive clauses. Donde refers to place; cuyo agrees with the possessed noun.", "Es el libro que estoy leyendo.", "It is the book that I am reading."]}, {"id": "v2-9", "title": "News and society", "sub": "Summarize and report information", "level": "B2", "icon": "book", "vocab": [["un artículo", "article"], ["una fuente", "source"], ["un reportaje", "report"], ["un testimonio", "testimony"], ["una investigación", "investigation"], ["una prueba", "evidence"], ["anunciar", "to announce"], ["afirmar", "to assert"], ["según los medios", "according to the media"], ["un asunto", "issue"]], "grammar": ["Reported speech", "Use decir que for statements and preguntar si for yes/no questions. Past reporting often shifts tenses: dijo que venía. Time expressions may also change: hoy → ese día.", "Dijo que estaba lista.", "She said that she was ready."]}, {"id": "v2-10", "title": "Uncertainty and possibility", "sub": "Discuss wishes and hypothetical situations", "level": "B2", "icon": "book", "vocab": [["una hipótesis", "hypothesis"], ["una duda", "doubt"], ["una posibilidad", "possibility"], ["un deseo", "wish"], ["con tal de que", "provided that"], ["aunque", "although"], ["puede que", "it may be that"], ["a menos que", "unless"], ["incierto", "uncertain"], ["probable", "likely"]], "grammar": ["Present subjunctive", "Use subjunctive after wishes, influence, emotion, doubt and certain conjunctions. Start with present yo form, remove -o, and add opposite vowel endings: hable, coma. Irregular examples: sea, vaya, tenga.", "Espero que tengas tiempo.", "I hope you have time."]}, {"id": "v2-11", "title": "Formal communication", "sub": "Build clear arguments and formal writing", "level": "B2", "icon": "book", "vocab": [["no obstante", "nevertheless"], ["además", "furthermore"], ["por lo tanto", "therefore"], ["en conjunto", "overall"], ["un argumento", "argument"], ["una conclusión", "conclusion"], ["un enfoque", "approach"], ["una consecuencia", "consequence"], ["una mejora", "improvement"], ["atentamente", "kind regards"]], "grammar": ["Passive and impersonal se", "Ser + past participle agrees with the subject: las cartas fueron enviadas. Passive se agrees with the grammatical subject: se venden libros. Impersonal se uses third-person singular: se vive bien aquí.", "El informe fue publicado ayer.", "The report was published yesterday."]}], "ar": [{"id": "v2-0", "title": "Everyday routines", "sub": "Describe habits and frequency", "level": "A2", "icon": "book", "vocab": [["أستيقظ", "I wake up"], ["أنهض", "I get up"], ["أستحمّ", "I shower"], ["أرتدي ملابسي", "I get dressed"], ["أنام", "I sleep"], ["مبكرًا", "early"], ["متأخرًا", "late"], ["عادةً", "usually"], ["كل صباح", "every morning"], ["نادرًا", "rarely"]], "grammar": ["Present verbs and habitual time", "In MSA the present verb begins with أ for I, ت for you (masculine singular) or she, ي for he, and ن for we. Frequency expressions can follow or precede the clause.", "أستيقظ في الساعة السابعة.", "I wake up at seven."]}, {"id": "v2-1", "title": "Past experiences", "sub": "Tell someone what happened", "level": "A2", "icon": "book", "vocab": [["رأيتُ", "I saw"], ["فعلتُ", "I did"], ["اشتريتُ", "I bought"], ["أخذتُ", "I took"], ["ذهبتُ", "I went"], ["عدتُ", "I returned"], ["البارحة", "last night"], ["الأسبوع الماضي", "last week"], ["مرة واحدة", "once"], ["من قبل", "before"]], "grammar": ["Perfect (past) verb", "MSA past verbs typically mark person through endings. For كتب (to write): كتبتُ I wrote, كتبَ he wrote, كتبتْ she wrote, كتبنا we wrote. Subject pronouns are often omitted.", "اشتريتُ كتابًا أمس.", "I bought a book yesterday."]}, {"id": "v2-2", "title": "Future and plans", "sub": "Make plans and predictions", "level": "A2", "icon": "book", "vocab": [["قريبًا", "soon"], ["لاحقًا", "later"], ["الشهر المقبل", "next month"], ["أخطط", "I plan"], ["آمل", "I hope"], ["أعد", "I promise"], ["ألغي", "I cancel"], ["خطة", "a plan"], ["سأكون", "I will be"], ["سأفعل", "I will do"]], "grammar": ["Future with س and سوف", "Attach سـ to a present verb or place سوف before it to express the future: سأدرس or سوف أدرس. Both are standard future markers; context determines time.", "سنسافر غدًا.", "We will travel tomorrow."]}, {"id": "v2-3", "title": "Health and appointments", "sub": "Explain symptoms and make appointments", "level": "A2", "icon": "book", "vocab": [["موعد", "appointment"], ["ألم", "pain"], ["حمّى", "fever"], ["سعال", "cough"], ["ظهر", "back"], ["حلق", "throat"], ["وصفة طبية", "prescription"], ["صيدلية", "pharmacy"], ["أستريح", "I rest"], ["طبيب", "doctor"]], "grammar": ["Possession and necessity", "Use عندي or لديّ for I have. To say that something hurts, use يؤلمني with a masculine subject or تؤلمني with a feminine subject. يجب أن + subjunctive expresses necessity.", "عندي صداع.", "I have a headache."]}, {"id": "v2-4", "title": "Shopping and comparisons", "sub": "Compare options and negotiate", "level": "B1", "icon": "book", "vocab": [["سعر", "price"], ["خصم", "discount"], ["مقاس", "size"], ["أجرّب", "I try"], ["غالٍ", "expensive"], ["رخيص", "inexpensive"], ["صندوق الدفع", "checkout"], ["إيصال", "receipt"], ["أستبدل", "I exchange"], ["جودة", "quality"]], "grammar": ["Comparative أفعل", "Many adjectives use an أفعل comparative: كبير becomes أكبر, رخيص becomes أرخص. Follow it with من for than. In comparisons this form normally stays masculine singular.", "هذا المعطف أرخص من الآخر.", "This coat is cheaper than the other one."]}, {"id": "v2-5", "title": "Work and study", "sub": "Describe responsibilities and skills", "level": "B1", "icon": "book", "vocab": [["مقابلة", "interview"], ["طلب", "application"], ["مهارة", "skill"], ["زميل", "colleague"], ["اجتماع", "meeting"], ["موعد نهائي", "deadline"], ["تدريب عملي", "internship"], ["أنجح", "I succeed"], ["واجب", "assignment"], ["بحث", "research"]], "grammar": ["Attached object pronouns", "Suffixes attach to verbs: رأيته I saw him, رأيتها I saw her, رآني he saw me. The same core suffixes attach to nouns for possession, with some form differences.", "أرسلتُ له رسالةً.", "I sent him a message."]}, {"id": "v2-6", "title": "Memories and storytelling", "sub": "Set the scene and narrate events", "level": "B1", "icon": "book", "vocab": [["في الماضي", "in the past"], ["بينما", "while"], ["فجأة", "suddenly"], ["في ذلك الوقت", "at that time"], ["ذكرى", "a memory"], ["أتذكّر", "I remember"], ["كبرتُ", "I grew up"], ["طفولة", "childhood"], ["في البداية", "at first"], ["أخيرًا", "finally"]], "grammar": ["كان + present verb", "Use كان + present verb to describe past ongoing or habitual actions: كنت أدرس I was studying or used to study. A perfect verb can introduce the bounded event that interrupts it.", "كنت أدرس عندما وصل صديقي.", "I was studying when my friend arrived."]}, {"id": "v2-7", "title": "Advice and requests", "sub": "Speak politely and solve problems", "level": "B1", "icon": "book", "vocab": [["نصيحة", "advice"], ["أنصح", "I advise"], ["حلّ", "solution"], ["مشكلة", "problem"], ["من الضروري", "it is necessary"], ["يمكنني", "I can"], ["أودّ", "I would like"], ["أقترح", "I suggest"], ["طلب", "request"], ["في حال", "in case of"]], "grammar": ["Polite requests and imperatives", "Use هل يمكنك أن…؟ for a polite can-you request to a man; هل يمكنكِ أن…؟ to a woman. For masculine singular, many commands omit the present prefix and use a helping initial vowel: اكتب (write).", "هل يمكنك مساعدتي؟", "Could you help me?"]}, {"id": "v2-8", "title": "Opinions and relationships", "sub": "Express attitudes and connect ideas", "level": "B1", "icon": "book", "vocab": [["في رأيي", "in my opinion"], ["أوافق", "I agree"], ["أعارض", "I oppose"], ["علاقة", "relationship"], ["ثقة", "trust"], ["نقاش", "debate"], ["رأي", "opinion"], ["في المقابل", "on the other hand"], ["مع ذلك", "however"], ["وفقًا لـ", "according to"]], "grammar": ["Relative clauses", "Definite nouns take a relative pronoun agreeing in gender and number: الذي masculine singular, التي feminine singular, الذين masculine human plural. Indefinite nouns often take a descriptive clause without an explicit relative pronoun.", "هذا هو الكتاب الذي أقرؤه.", "This is the book that I am reading."]}, {"id": "v2-9", "title": "News and society", "sub": "Summarize and report information", "level": "B2", "icon": "book", "vocab": [["مقال", "article"], ["مصدر", "source"], ["تقرير", "report"], ["شهادة", "testimony"], ["تحقيق", "investigation"], ["دليل", "evidence"], ["يعلن", "he announces"], ["يؤكّد", "he asserts"], ["وفقًا لوسائل الإعلام", "according to the media"], ["قضية", "issue"]], "grammar": ["Reported speech with إنّ and أنّ", "After قال, use إنّ in many quoted or reported clauses: قال إنّه مستعدّ. Use أنّ after many other verbs, such as علمت أنّه مستعدّ. Arabic does not require the English-style backshift in all contexts.", "قالت إنّها مستعدّة.", "She said that she was ready."]}, {"id": "v2-10", "title": "Uncertainty and possibility", "sub": "Discuss wishes and hypothetical situations", "level": "B2", "icon": "book", "vocab": [["فرضية", "hypothesis"], ["شكّ", "doubt"], ["احتمال", "possibility"], ["أمنية", "wish"], ["بشرط أن", "provided that"], ["على الرغم من", "despite"], ["ربما", "perhaps"], ["ما لم", "unless"], ["غير مؤكّد", "uncertain"], ["محتمل", "likely"]], "grammar": ["Subjunctive and conditional clauses", "After أن, لن, كي, the imperfect normally takes subjunctive endings (e.g. لن أذهبَ). إنْ can introduce a possible condition with jussive verbs; لو often introduces unreal or counterfactual conditions.", "لو كان لديّ وقتٌ لسافرتُ.", "If I had time, I would travel."]}, {"id": "v2-11", "title": "Formal communication", "sub": "Build clear arguments and formal writing", "level": "B2", "icon": "book", "vocab": [["مع ذلك", "nevertheless"], ["بالإضافة إلى ذلك", "furthermore"], ["لذلك", "therefore"], ["بوجه عام", "overall"], ["حجّة", "argument"], ["خلاصة", "conclusion"], ["نهج", "approach"], ["نتيجة", "consequence"], ["تحسين", "improvement"], ["مع خالص التحية", "kind regards"]], "grammar": ["Passive and formal connectors", "The internal passive changes verb vowels: كَتَبَ → كُتِبَ (was written), يَكْتُبُ → يُكْتَبُ (is written). Use connectors such as بالإضافة إلى ذلك and لذلك to structure formal arguments.", "نُشِرَ التقرير أمس.", "The report was published yesterday."]}]};

window.LUMI_DEEP={"fr": [["Articles and plurals", "le livre / les livres / des livres", "Use le/la/l’ for known or generic singular nouns; un/une for one non-specific thing; les/des for plural. The plural -s is usually silent. Some plurals change: un cheval → des chevaux."], ["Partitive and quantity", "Je bois du café. Je ne bois pas de café.", "Du, de la, de l’ express an unspecified amount. After most negative verbs and many quantity expressions, use de: beaucoup de café. With être, the article generally remains."], ["Adjective placement and agreement", "une petite maison blanche", "Adjectives generally agree with noun gender and number. Many follow the noun; common short adjectives such as petit, grand and beau often precede it. Meaning can change with position: un ancien professeur (former), un meuble ancien (old)."], ["Questions and register", "Tu viens ? / Est-ce que tu viens ? / Viens-tu ?", "Rising intonation is common in conversation, est-ce que is widely useful, and inversion is more formal. For information questions, où, quand, pourquoi, comment and combien introduce the missing detail."], ["Y and en", "J’y vais. J’en veux deux.", "Y often replaces a place or à + thing. En often replaces de + thing or an indefinite quantity. Keep the number when stating quantity: j’en ai trois. These usually precede a finite verb."], ["Past participle agreement", "Les lettres que j’ai écrites.", "With avoir, a past participle generally agrees with a preceding direct object, not the subject. With être, ordinary non-reflexive constructions agree with the subject; reflexive agreement depends on the object relation."], ["Pronoun order", "Je le lui donne.", "Common order before a finite verb: me/te/se/nous/vous, then le/la/les, then lui/leur, then y, then en. Affirmative commands use a different order: donne-le-moi."], ["Register and idioms", "On y va ? / Nous y allons.", "On commonly replaces nous in everyday speech but takes a third-person singular verb. Tu is familiar; vous is polite or plural. Learn idioms as chunks: avoir faim (be hungry), avoir besoin de (need)."]], "es": [["Gender and number", "el problema / las ciudades", "Many -o nouns are masculine and -a nouns feminine, but exceptions include el problema and la mano. Add -s after most vowels and -es after most consonants; adjectives and articles agree."], ["Ser, estar and hay", "Soy estudiante. Estoy en casa. Hay un libro.", "Ser identifies, classifies or describes characteristics; estar locates people or things and describes states; hay introduces existence. Event locations generally use ser: la fiesta es aquí."], ["Gustar and similar verbs", "Me gusta el libro. Me gustan los libros.", "The liked thing is the grammatical subject; the experiencer is indirect. Use me, te, le, nos, os, les. Encantar, interesar and doler often use related patterns."], ["Por and para", "Estudio para aprender. Gracias por ayudarme.", "Para commonly expresses purpose, destination, recipient or deadline. Por often expresses cause, route, duration or exchange. Learn examples rather than a single English equivalent."], ["Direct and indirect pronouns", "Se lo doy a Ana.", "Lo/la/los/las are direct object forms; le/les indirect. When they combine, le/les become se. Place pronouns before finite verbs, or attach to affirmative imperatives and optionally infinitives/gerunds."], ["Commands", "Habla. No hables. Hable, por favor.", "Affirmative tú commands often resemble the third-person present; negative tú and formal usted commands use subjunctive forms. Irregular affirmative tú commands include di, haz, ve, pon, sal, sé, ten, ven."], ["Perfect and regional variation", "He comido / Comí.", "The present perfect uses haber + invariant participle. Its use for recent past varies by region; preterite is common in much of Latin America where parts of Spain prefer the perfect."], ["Personal a and word order", "Veo a María. Veo la casa.", "A often precedes a specific human direct object. Spanish subject pronouns are often omitted when clear; word order can shift for focus. Do not equate a flexible order with arbitrary word order."]], "ar": [["Roots and patterns", "كتب / كتاب / كاتب / مكتبة", "Many Arabic words are built from consonantal roots and patterns. ك ت ب relates to writing: kitāb (book), kātib (writer), maktaba (library/bookshop). Roots guide guesses but do not guarantee exact meaning."], ["Noun cases and definiteness", "كتابٌ / كتابًا / كتابٍ", "In fully inflected MSA, nominative often marks subjects, accusative objects, and genitive follows prepositions or a construct noun. Case endings are often omitted in unvowelled writing and pause. Diptotes and other classes differ."], ["Iḍāfa and possession", "كتاب الطالب / كتابي", "In the construct phrase, the first noun cannot take the definite article or tanwīn, while the second noun is genitive. The second can make the phrase definite. Possessive suffixes include ـي my, ـكَ your (m.), ـه his."], ["Dual and plural", "كتابان / كتب / معلّمون", "Dual nominative uses ـان and accusative/genitive ـين. Sound masculine plural often uses ـون/ـين, feminine plural ـات. Broken plurals change internal patterns; learn them alongside each singular noun."], ["Nonhuman plural agreement", "الكتب الجديدة", "In standard Arabic, nonhuman plurals generally take feminine singular adjective and pronoun agreement. Human plurals typically follow their own plural gender patterns."], ["Word order and agreement", "كتب الطلاب. الطلاب كتبوا.", "In standard verb-first order with an overt plural human subject, the verb is generally singular but agrees in gender. With subject-first order, the verb normally agrees in number and gender too."], ["Negation system", "لا أذهب / لم أذهبْ / لن أذهبَ", "لا commonly negates present; لم + jussive negates a past event; لن + subjunctive negates future. ليس negates many present nominal predicates. ما can also negate past verbs."], ["Verb forms and derived meaning", "كتب / كاتَب / اكتتب", "Derived verb forms change patterns, sometimes giving causative, reciprocal, reflexive or other senses. Form II often intensifies or causativizes; Form III often implies interaction. Meanings are lexical: verify each word individually."]]};

window.LUMI_GRAMMAR={"fr": [["Choose the correct present-tense form: Nous ___ français.", "parlons", "parlez", "parlent", "parle", "With nous, regular -er verbs normally end in -ons."], ["Choose the correct article: ___ école est ouverte.", "L’", "Le", "La", "Les", "Le and la elide to l’ before a vowel or mute h."], ["Complete the negative: Je ___ comprends pas.", "ne", "me", "n’y", "de", "Standard negation places ne before the verb and pas after it."], ["Choose the form for a completed event: Hier, elle ___ à midi.", "est partie", "est parti", "a partie", "partaient", "Partir uses être in the passé composé; the participle agrees with elle."], ["Complete the background action: Je lisais quand le téléphone ___.", "a sonné", "sonnait toujours", "sonner", "sonnera", "The sudden bounded event uses the passé composé here."], ["Replace à Paul: Je parle à Paul → Je ___ parle.", "lui", "le", "la", "leur", "Parler à a singular person takes the indirect pronoun lui."], ["Complete the wish: Il faut que tu ___ prudent.", "sois", "es", "seras", "étais", "Il faut que triggers the subjunctive; être has the form sois with tu."], ["Complete the hypothetical: Si j’avais le temps, je ___.", "voyagerais", "voyagerai", "voyageais hier", "voyage", "Si + imparfait pairs with a present conditional in this hypothetical."], ["Choose the correct relative pronoun: Le film ___ je regarde est drôle.", "que", "qui", "dont", "où", "The relative pronoun replaces the direct object of regarde, so use que."], ["Choose the correct agreement: Les lettres sont ___.", "envoyées", "envoyés", "envoyé", "envoyer", "A passive participle agrees with the feminine plural subject lettres."]], "es": [["Complete the present tense: Nosotros ___ español.", "hablamos", "hablan", "habláis", "hablo", "Regular -ar verbs take -amos with nosotros."], ["Choose the normal expression for location: Madrid ___ en España.", "está", "es", "son", "están", "Estar describes the location of a city; Madrid is singular."], ["Choose the function lessonTasks(i){let list=current().units[i].vocab;let picks=[0,3,5,2,7,8,1,6];let types=['meaning','reverse','listen','type','meaning','reverse','speak','listen'];return picks.map((n,k)=>{let w=list[n],type=types[k],field=type==='reverse'?0:1;let choices=[];if(type==='meaning'||type==='reverse'||type==='listen'){let all=list.map(x=>x[field]);let wrong=all.filter((v,j)=>j!==n&&norm(v)!==norm(w[field]));let rotation=(i+k*3)%wrong.length;choices=[w[field],wrong[rotation],wrong[(rotation+3)%wrong.length],wrong[(rotation+6)%wrong.length]];let shift=(k+i)%4;choices=choices.slice(shift).concat(choices.slice(0,shift));}return {type,target:w[0],english:w[1],pron:w[2]||'',choices,answer:w[field]};});}
function grammarTask(i){let g=current().units[i].grammar;let target=g[2],english=g[3];let alt=current().units.filter((_,n)=>n!==i).map(u=>u.grammar[2]);let others=[alt[(i+2)%alt.length],alt[(i+5)%alt.length],alt[(i+8)%alt.length]];let answers=[target,...others];let shift=(i+1)%4;answers=answers.slice(shift).concat(answers.slice(0,shift));return {type:'grammar',target,english,pron:'',choices:answers,answer:target};}
function startLesson(i){let n=Number(i);if(!current().units[n])return;keepLesson();let r=record().resume;ui.unit=n;if(validResume(r)&&r.lesson.unit===n){ui.lesson={...r.lesson};ui.selected=r.selected??null;ui.graded=r.graded??null;ui.typed=r.typed||'';}else{ui.lesson={unit:n,stage:0,correct:0,answered:0};ui.selected=null;ui.graded=null;ui.typed='';}ui.page='lesson';ui.mobileOpen=false;keepLesson();window.scrollTo({top:0});render();}

 let content='';if(stage===0){content=`<div class="stage-eyebrow">${stageText}</div><h2>${e(u.title)}</h2><p class="lead">Listen to the words and their meanings. Focus on recognition before trying to remember everything.</p><div class="vocab-preview">${u.vocab.map(w=>`<div class="vocab-item"><div><strong class="${state.lang==='ar'?'arabic arabic-lg':''}" ${state.lang==='ar'?'dir="rtl"':''} lang="${state.lang}">${e(w[0])}</strong><small>${e(w[1])}${w[2]?` · ${e(w[2])}`:''}</small></div><button class="pronounce" data-action="speak" data-text="${e(w[0])}" aria-label="Hear ${e(w[0])}">${icon('sound')}</button></div>`).join('')}</div><div class="lesson-foot"><span class="tip">Tip: say each word out loud once.</span><button class="btn btn-primary" data-action="lesson-next">See grammar concept ${icon('arrow')}</button></div>`;}
 else if(stage===1){content=`<div class="stage-eyebrow">${stageText}</div><h2>${e(u.grammar[0])}</h2><p class="lead">Learn the pattern before practicing it.</p><div class="grammar-box"><strong>THE IDEA</strong><p>${e(u.grammar[1])}</p><div class="example-row"><div class="target ${state.lang==='ar'?'arabic arabic-lg':''}" ${state.lang==='ar'?'dir="rtl"':''}>${e(u.grammar[2])}</div><small>${e(u.grammar[3])}</small></div></div><div style="margin-top:25px">${playButton(u.grammar[2],'Hear the example')}</div><div class="lesson-foot"><span class="tip">You'll practice 9 short questions next.</span><button class="btn btn-primary" data-action="lesson-next">Start practice ${icon('arrow')}</button></div>`;}
 else {let q=stage===10?grammarTask(s.unit):lessonTasks(s.unit)[stage-2];if(!q)return '';let prompt=q.type==='meaning'?'What does this mean?':q.type==='reverse'?'Choose the correct translation':q.type==='grammar'?'Apply the grammar pattern':q.type==='listen'?'Listen and select the meaning':q.type==='type'?'Type the English meaning':'Pronunciation practice';let question=(q.type==='reverse'||q.type==='grammar')?q.english:q.target;let isListen=q.type==='listen',isSpeak=q.type==='speak';content=`<div class="stage-eyebrow">${stageText}</div><h2>${e(prompt)}</h2><p class="lead">${isSpeak?'Speak the phrase aloud. Browser speech recognition is optional.':isListen?'Listen carefully before choosing your answer.':'Take your time. Accuracy matters more than speed.'}</p><div class="question-card">${isListen?`<div class="stage-eyebrow" style="margin-bottom:10px">AUDIO CHALLENGE</div>${playButton(q.target,'Play audio')}`:`<div class="target ${state.lang==='ar'&&!['reverse','grammar'].includes(q.type)?'arabic':''}" ${state.lang==='ar'&&!['reverse','grammar'].includes(q.type)?'dir="rtl"':''}>${e(question)}</div>${q.pron&&q.type!=='reverse'?`<div class="subtitle">${e(q.pron)}</div>`:''}<div style="margin-top:15px">${!['reverse','grammar'].includes(q.type)?playButton(q.target,'Listen'):''}</div>`}</div>

function scoreAnswer(correct,note){if(ui.graded)return;ui.graded={correct:!!correct,note};ui.lesson.answered++;if(correct)ui.lesson.correct++;record().answerCount++;if(correct)record().correctCount++;const q=ui.lesson.stage===10?grammarTask(ui.lesson.unit):lessonTasks(ui.lesson.unit)[ui.lesson.stage-2];if(!correct&&q)rememberMistake(q.target,q.english);points(correct?10:3);keepLesson();render();}
function checkLesson(){if(!ui.lesson||ui.lesson.stage<2||ui.graded)return;let q=ui.lesson.stage===10?grammarTask(ui.lesson.unit):lessonTasks(ui.lesson.unit)[ui.lesson.stage-2];if(!q)return;if(q.type==='type'){let answer=ui.typed.trim();if(!answer){toast('Type an answer first.');return;}let expected=q.english.split(' / ').map(norm);let got=norm(answer);scoreAnswer(expected.includes(got)||got===norm(q.english),`Correct answer: ${q.english}`);}else {if(ui.selected===null)return;scoreAnswer(norm(q.choices[ui.selected])===norm(q.answer),`Correct answer: ${q.answer}`);}}
function finishLesson(){let i=ui.lesson.unit,accuracy=ui.lesson.correct;if(accuracy>=6)record().completed[i]=true;introduceUnit(i);points(25);record().resume=null;save();ui.lesson=null;go('learn');toast(`${accuracy>=6?'Lesson passed!':'Practice finished — revisit this unit.'} ${accuracy}/9 correct · +25 bonus XP. Your words are in Smart review.`);}

function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Speech recognition is not available here. Practice aloud and select “I practiced aloud.”');return;}let q=lessonTasks(ui.lesson.unit)[ui.lesson.stage-2],session=ui.lesson,lang=state.lang,stage=ui.lesson.stage;try{let rec=new SR();rec.lang=current().locale;rec.interimResults=false;rec.maxAlternatives=3;toast('Listening… speak now.');rec.onresult=event=>{if(ui.page!=='lesson'||ui.lesson!==session||ui.lesson.stage!==stage||state.lang!==lang||ui.graded)return;let alternatives=Array.from(event.results[0]).map(x=>x.transcript);let match=alternatives.some(x=>norm(x)===norm(q.target));scoreAnswer(match,match?`Recognized: ${alternatives[0]}`:`Heard: ${alternatives[0]}. Target phrase: ${q.target}. Recognition can mishear accents; try again in review.`);};rec.onerror=event=>toast(`Microphone unavailable (${event.error}). You can mark this as practiced.`);rec.start();}catch{toast('Microphone access could not start.');}}

function review(){let r=record(),id=ui.reviewQueue[0],w=id&&findWord(id);let total=Object.keys(r.reviews).length;if(ui.reviewDone||!w){return `${head('ACTIVE RECALL','Smart review','Spaced repetition helps you revisit words before they fade.')}${languageTabs()}<div class="flash-layout"><div class="card flashempty"><div class="tile-icon" style="margin:0 auto">${icon('check')}</div><h2>${ui.reviewDone?'Review session finished!':'You’re all caught up.'}</h2><p>${ui.reviewDone?'Your next review dates have been adjusted based on your answers.':'No cards are due at the moment. Add a new unit or come back when your reviews are ready.'}</p><div class="button-row" style="justify-content:center"><button class="btn btn-primary" data-nav="learn">Explore lessons ${icon('arrow')}</button><button class="btn btn-soft" data-nav="words">Browse word bank</button></div></div></div><p class="footnote" style="text-align:center;margin-top:15px">${total} saved cards · ${reviewCount()} due now</p>`;}

function rate(kind){let id=ui.reviewQueue.shift(),r=record().reviews[id];if(!r)return;let old=r.interval||0;let factor=r.ease||2.5;let days=0;if(kind==='again'){r.reps=0;r.ease=Math.max(1.3,factor-.2);r.interval=0;r.due=Date.now()+60*1000;if(!ui.reviewRepeated.has(id)){ui.reviewQueue.push(id);ui.reviewRepeated.add(id);}}if(kind==='hard'){r.reps++;r.ease=Math.max(1.3,factor-.12);days=old?Math.max(1,Math.round(old*1.2)):1;}if(kind==='good'){r.reps++;days=old?Math.max(2,Math.round(old*factor)):(r.reps===1?1:3);}if(kind==='easy'){r.reps++;r.ease=factor+.15;days=old?Math.max(4,Math.round(old*(factor+.3))):4;}if(kind!=='again'){r.interval=days;r.due=Date.now()+days*86400000;r.inSessionRepeat=false;}r.last=Date.now();ui.reviewNum++;ui.reviewRevealed=false;points(kind==='again'?1:kind==='hard'?3:kind==='good'?5:7);if(!ui.reviewQueue.length)ui.reviewDone=true;render();}

function dialogues(){return `${head('PRACTICE REAL SITUATIONS','Learn by having conversations','Choose your replies in guided role-play scenarios. Hear every line spoken.') }<div style="margin-bottom:24px">${languageTabs()}</div><div class="scenario-grid">${current().dialogues.map((s,i)=>`<button class="story-card scenario-tile" data-action="open-dialogue" data-index="${i}"><div class="ill">${['🥐','🗺️','🤝','🏨','🛍️','🎓'][i%6]}</div><span class="tag">ROLE-PLAY ${i+1}</span><h3 style="margin-top:12px">${e(s.title)}</h3><p>${e(s.place)} · ${e(s.intro)}</p><span class="text-link">Start conversation →</span></button>`).join('')}</div><div class="feature-note">These are guided branching exercises, not live AI conversations. They focus on practicing useful responses with feedback.</div>`;}

function conversation(){let d=ui.dialogue;if(!d)return '';let s=current().dialogues[d.id],step=s.steps[d.step];return `<button class="back" data-nav="speak">${icon('back')} All conversations</button><div class="chat-window">${head('GUIDED ROLE-PLAY',e(s.title),e(s.place)+' · '+e(s.intro))}<div class="chat-log" aria-live="polite">${d.history.map(m=>`<div class="chat-bubble ${m.who==='you'?'you':''}"><span class="chat-tag">${m.who==='you'?'YOU':'LOCAL SPEAKER'}</span><span class="${state.lang==='ar'?'arabic':''}" ${state.lang==='ar'?'dir="rtl"':''}>${e(m.text)}</span></div>`).join('')}</div><div class="button-row" style="margin:15px 0">${playButton(d.history.filter(x=>x.who==='bot').slice(-1)[0]?.text||'', 'Hear latest reply')}</div>${d.feedback?`<div class="feedback ${d.feedback.correct?'':'bad'}">${e(d.feedback.message)}</div>`:''}${d.done?`<div class="card" style="text-align:center"><div style="font-size:34px">🎉</div><h2>Conversation completed!</h2><p style="font-size:12px;color:#9093a5">${d.score}/${s.steps.length} natural replies · You earned conversation XP.</p><button class="btn btn-primary" data-nav="speak">Choose another scene ${icon('arrow')}</button></div>`:`<div class="stage-eyebrow" style="margin-top:23px">HOW WOULD YOU RESPOND? · ${d.step+1}/${s.steps.length}</div><div class="chat-options">${step.choices.map((c,i)=>`<button class="option" data-action="dialogue-answer" data-index="${i}"><span class="opt-letter">${'ABC'[i]}</span><span class="${state.lang==='ar'?'arabic':''}" ${state.lang==='ar'?'dir="rtl"':''}>${e(c)}</span></button>`).join('')}</div>`}</div>`;}
function dialogueAnswer(i){let d=ui.dialogue;if(!d||d.done)return;let s=current().dialogues[d.id],step=s.steps[d.step],correct=Number(i)===step.correct;d.history.push({who:'you',text:step.choices[i]});d.history.push({who:'bot',text:step.reply});if(correct)d.score++;d.feedback={correct,message:correct?'Great reply — that fits the conversation!':'Good practice. A more natural reply here is: '+step.choices[step.correct]};points(correct?10:3);d.step++;if(d.step>=s.steps.length){d.done=true;record().dialogues[d.id]=true;points(20);}else if(step.reply!==s.steps[d.step].npc)d.history.push({who:'bot',text:s.steps[d.step].npc});render();}
function grammar(){return `${head('HOW THE LANGUAGE WORKS','Grammar lab','A concept-first reference for each unit, with clear explanations and useful examples.') }<div style="margin-bottom:23px">${languageTabs()}</div><div class="grammar-grid">${current().units.map((u,i)=>`<div class="grammar-tile"><span class="tag">UNIT ${i+1} · ${u.level}</span><h3>${e(u.grammar[0])}</h3><p>${e(u.grammar[1])}</p><div class="example ${state.lang==='ar'?'arabic':''}" ${state.lang==='ar'?'dir="rtl"':''}>${e(u.grammar[2])}<small>${e(u.grammar[3])}</small></div><div class="button-row" style="margin-top:12px"><button class="btn btn-ghost btn-small" data-action="speak" data-text="${e(u.grammar[2])}">${icon('sound')} Listen</button><button class="btn btn-soft btn-small" data-action="start-lesson" data-unit="${i}">Practice ${icon('arrow')}</button></div></div>`).join('')}</div><div class="section-line"><h2>Deep dive · language mechanics</h2><button class="btn btn-soft btn-small" data-action="v2-drill" data-mode="grammar">Grammar challenge →</button></div><div class="v2-grid">${window.LUMI_DEEP[state.lang].map(([name,ex,body])=>`<article class="card v2-card"><h2>${e(name)}</h2><div class="v2-example">${target(ex)}</div><p>${e(body)}</p>${playButton(ex,'Listen')}</article>`).join('')}</div>`;}
function wordbank(){let w=words(),r=record(),unit=ui.wordUnit;if(unit!=='all')w=w.filter(x=>x.unit===Number(unit));let query=norm(ui.search);if(query)w=w.filter(x=>norm([x.target,x.english,x.pron,x.topic].join(' ')).includes(query));return `${head('YOUR WORD LIBRARY','Vocabulary bank','Search 240 real words and expressions in your selected language, listen, and build your own review deck.') }<div style="margin-bottom:21px">${languageTabs()}</div><div class="card"><div class="filter-bar"><input class="search-input" id="dictionarySearch" placeholder="Search words, translations or pronunciation..." value="${e(ui.search)}" style="flex:1;min-width:170px" aria-label="Search vocabulary"><select class="select" id="unitFilter" aria-label="Filter units"><option value="all">All units</option>${current().units.map((x,i)=>`<option value="${i}" ${unit===String(i)?'selected':''}>${e(x.title)}</option>`).join('')}</select></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span class="tag">${w.length} matching expressions</span><button class="btn btn-soft btn-small" data-action="add-filtered">${icon('plus')} Add visible to review</button></div><div style="overflow-x:auto"><table class="word-table"><thead><tr><th>WORD</th><th>MEANING</th><th>UNIT</th><th>ACTIONS</th></tr></thead><tbody>${w.length?w.map(x=>`<tr><td class="${state.lang==='ar'?'arabic':''}" ${state.lang==='ar'?'dir="rtl"':''}>${e(x.target)}${x.pron?`<div class="sub" dir="ltr">${e(x.pron)}</div>`:''}</td><td>${e(x.english)}</td><td><span class="tag">${e(x.topic)}</span></td><td style="white-space:nowrap"><button data-action="speak" data-text="${e(x.target)}" aria-label="Hear word">${icon('sound')}</button><button data-action="toggle-card" data-id="${e(x.id)}" aria-label="${r.reviews[x.id]?'Remove from':'Add to'} review">${icon(r.reviews[x.id]?'check':'plus')}</button></td></tr>`).join(''):`<tr><td colspan="4" style="text-align:center;color:#999;padding:30px">No matching words. Try a different search.</td></tr>`}</tbody></table></div></div>`;}
function setCard(id){let r=record(),w=findWord(id);if(!w)return;if(r.reviews[id]){delete r.reviews[id];toast('Removed from your review deck.');}else{r.reviews[id]={due:Date.now(),interval:0,ease:2.5,reps:0,last:null};toast('Added to your review deck.');}save();render();}
function addFiltered(){let w=words().filter(x=>ui.wordUnit==='all'||x.unit===Number(ui.wordUnit));let query=norm(ui.search);if(query)w=w.filter(x=>norm([x.target,x.english,x.pron,x.topic].join(' ')).includes(query));w.forEach(x=>{if(!record().reviews[x.id])record().reviews[x.id]={due:Date.now(),interval:0,ease:2.5,reps:0,last:null};});save();toast(`${w.length} matching expressions are available in Smart review.`);render();}
function achievements(){let xp=totalXP(),comp=LANG_KEYS.reduce((n,l)=>n+Object.keys(state.langs[l].completed).filter(k=>state.langs[l].completed[k]).length,0),tri=LANG_KEYS.every(l=>Object.values(state.langs[l].completed).some(Boolean));return [{icon:'🌱',name:'First steps',desc:'Complete a lesson',yes:comp>0},{icon:'⚡',name:'Momentum',desc:'Earn 100 XP',yes:xp>=100},{icon:'🔥',name:'One week',desc:'7-day streak',yes:streak()>=7},{icon:'🌍',name:'Polyglot',desc:'Study all 3 languages',yes:tri},{icon:'📚',name:'Bookworm',desc:'Read 3 stories',yes:LANG_KEYS.reduce((s,l)=>s+Object.keys(state.langs[l].stories).length,0)>=3},{icon:'💬',name:'Confident speaker',desc:'Finish 3 dialogues',yes:LANG_KEYS.reduce((s,l)=>s+Object.keys(state.langs[l].dialogues).length,0)>=3},{icon:'🏅',name:'Committed',desc:'Complete 10 units',yes:comp>=10},{icon:'🚀',name:'High flyer',desc:'Earn 1,000 XP',yes:xp>=1000}];}
function progress(){return `${head('YOUR LEARNING STORY','Progress & insights','A clear picture of what you have practiced, across all three languages.') }<div class="progress-grid">${LANG_KEYS.map(l=>{let r=state.langs[l],completed=Object.values(r.completed).filter(Boolean).length;return `<div class="card progress-lang"><h3>${LANGS[l].flag} ${LANGS[l].name}</h3><p>Learning experience</p><strong>${r.xp} XP</strong><div class="progress-block" style="margin-top:22px"><div class="rowtop"><span>Course units</span><span>${completed}/${LANGS[l].units.length}</span></div><div class="progress-bar"><span style="width:${completed/LANGS[l].units.length*100}%"></span></div></div><div class="metric-note">${Object.keys(r.reviews).length} review cards · ${r.answerCount?Math.round(r.correctCount/r.answerCount*100)+'% practice accuracy':'No answers yet'}</div></div>`;}).join('')}</div><div class="section-line"><div><h2>Practice trend</h2><p>Total XP earned across your languages</p></div><span class="tag">7-day overview</span></div><div class="card">${activityChart()}<div class="divider"></div><div style="display:flex;gap:28px;flex-wrap:wrap">${statline('Total XP',totalXP())}${statline('Current streak',streak()+' days')}${statline('Today’s goal',todayXP()+'/'+state.dailyGoal+' XP')}</div></div><div class="section-line"><div><h2>Milestones</h2><p>Keep studying to unlock these badges</p></div></div><div class="achievement-grid">${achievements().map(a=>`<div class="achievement ${a.yes?'earned':''}"><div class="medal">${a.icon}</div><h4>${e(a.name)}</h4><p>${e(a.desc)}</p></div>`).join('')}</div>`;}
const statline=(l,v)=>`<div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">${e(l)}</span><strong style="font-size:18px">${e(v)}</strong></div>`;
function settings(){return `${head('MAKE LUMI YOURS','Your preferences','Adjust your daily commitment, appearance, or download a copy of your learning history.') }<div class="settings-layout"><div class="card"><h2>Learning settings</h2><div class="setting-row"><div><strong>Current language</strong><p>Switch anytime. Each language tracks progress independently.</p></div><select class="select" id="prefLang">${LANG_KEYS.map(l=>`<option value="${l}" ${l===state.lang?'selected':''}>${LANGS[l].flag} ${LANGS[l].name}</option>`).join('')}</select></div><div class="setting-row"><div><strong>Daily XP goal</strong><p>Choose a target you can hit consistently.</p></div><div style="text-align:right"><strong id="goalNumber">${state.dailyGoal} XP</strong><div><input class="range" id="goalSlider" type="range" min="10" max="150" step="10" value="${state.dailyGoal}"></div></div></div><div class="setting-row"><div><strong>Appearance</strong><p>Go easy on your eyes at night.</p></div><button class="btn btn-soft btn-small" data-action="toggle-theme">${icon(state.theme==='dark'?'sun':'moon')} ${state.theme==='dark'?'Light':'Dark'} mode</button></div><div class="setting-row"><div><strong>Pronunciation</strong><p>Uses browser speech synthesis; available voices and quality vary by device.</p></div><button class="btn btn-ghost btn-small" data-action="speak" data-text="${e(current().hello)}">${icon('sound')} Test voice</button></div></div><div class="card"><h2>Your data & privacy</h2><div class="setting-row"><div><strong>Stored on this device</strong><p>Your XP, cards, streak, and lesson results are stored in this browser. No account or server is used.</p></div>${icon('check')}</div><div class="setting-row"><div><strong>Export your progress</strong><p>Download your data as a JSON backup. Save it somewhere safe.</p></div><button class="btn btn-soft btn-small" data-action="export">${icon('download')} Export</button></div><div class="setting-row"><div><strong>Import a backup</strong><p>Restore your data from a previous Lumi export.</p></div><label class="btn btn-ghost btn-small" for="importFile">${icon('upload')} Import</label><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="setting-row"><div><strong>Start over</strong><p>Erase learning progress and personal vocabulary. Reference audio is managed separately in the audio player.</p></div><button class="btn btn-danger btn-small" data-action="reset">${icon('trash')} Reset</button></div></div></div><p class="footnote" style="margin-top:18px">The downloaded HTML works offline; a hosted page needs to load first. Browser speech features may need connectivity. Microphone recognition may require an internet connection in some browsers. Clearing your browser data can erase progress unless you export it.</p>${voicePanel()}`;}
function go(p){keepLesson();if(p!==ui.page){if(audioPlaying)stopAudio(true);else stopAudio();if(ui.page==='voiceLab')stopMic();}if(p==='review'){openReview();return;}if(p==='drill')ui.drill=null;ui.page=p;ui.mobileOpen=false;if(p==='words'){ui.search='';ui.wordUnit='all';}window.scrollTo({top:0,behavior:'instant'});render();}
function render(){document.body.classList.toggle('dark',state.theme==='dark');renderSidebar();renderTopbar();let views={dashboard:dash,learn,lesson,review,read:stories,story,speak:dialogues,conversation,grammar,words:wordbank,progress,settings,routine,sounds,verbs,drill,journal,voiceLab,custom:customDeck,checkpoints:skillMap,handbook:handbook};document.getElementById('screen').innerHTML=(views[ui.page]||dash)();document.title=`${TITLES[ui.page]} · Lumi language studio`;refreshVoicePanel();}
function setLanguage(l){if(!LANG_KEYS.includes(l))return;if(l===state.lang){render();return;}keepLesson();stopMic();stopAudio();audioText='';paintAudio();audioMessage='';state.lang=l;save();ui.lesson=null;ui.dialogue=null;ui.drill=null;ui.model=false;ui.reviewQueue=[];ui.reviewDone=false;ui.mobileOpen=false;ui.selected=null;ui.wordUnit='all';ui.search='';if(['lesson','story','conversation'].includes(ui.page))ui.page='learn';if(ui.page==='review'){ui.reviewRepeated=new Set();ui.reviewQueue=dueWords().slice(0,24);ui.reviewTotal=ui.reviewQueue.length;ui.reviewNum=0;ui.reviewRevealed=false;}render();}
function exportData(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),schema:1},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`lumi-progress-${dkey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your progress backup has been downloaded.');}
function importData(file){if(!file)return;if(file.size>2_000_000){toast('Backup exceeds the 2 MB limit.');return;}let reader=new FileReader();reader.onload=()=>{try{let raw=JSON.parse(reader.result);if(!raw.langs||!LANG_KEYS.every(l=>raw.langs[l]&&typeof raw.langs[l].xp==='number'&&raw.langs[l].reviews&&typeof raw.langs[l].reviews==='object'))throw Error();let clean=makeState();clean.lang=LANG_KEYS.includes(raw.lang)?raw.lang:'fr';clean.theme=raw.theme==='dark'?'dark':'light';clean.dailyGoal=Math.max(10,Math.min(150,Number(raw.dailyGoal)||50));clean.studyMinutes=[15,30,45,60,90].includes(raw.studyMinutes)?raw.studyMinutes:30;clean.focusLang=LANG_KEYS.includes(raw.focusLang)?raw.focusLang:clean.lang;for(let l of LANG_KEYS){let input=raw.langs[l];let rr=defaultLang();rr.xp=Math.max(0,Math.min(1e8,input.xp));rr.activity=typeof input.activity==='object'&&input.activity?input.activity:{};rr.completed=typeof input.completed==='object'&&input.completed?input.completed:{};rr.stories=typeof input.stories==='object'&&input.stories?input.stories:{};rr.dialogues=typeof input.dialogues==='object'&&input.dialogues?input.dialogues:{};rr.mistakes=input.mistakes&&typeof input.mistakes==='object'?input.mistakes:{};rr.journal=input.journal&&typeof input.journal==='object'?input.journal:{};rr.skills=input.skills&&typeof input.skills==='object'?input.skills:{};rr.custom={};for(let [id,w] of Object.entries(input.custom||{}).slice(0,500)){if(/^c-[a-z0-9-]+$/.test(id)&&w&&typeof w.target==='string'&&typeof w.english==='string')rr.custom[id]={target:w.target.slice(0,180),english:w.english.slice(0,180),pron:String(w.pron||'').slice(0,180)};}let resume=input.resume;if(resume&&Number.isInteger(resume.lesson?.unit)&&LANGS[l].units[resume.lesson.unit]&&Number.isInteger(resume.lesson.stage)&&resume.lesson.stage>=0&&resume.lesson.stage<=10)rr.resume={lesson:{unit:resume.lesson.unit,stage:resume.lesson.stage,correct:Math.max(0,Math.min(9,Number(resume.lesson.correct)||0)),answered:Math.max(0,Math.min(9,Number(resume.lesson.answered)||0))},selected:Number.isInteger(resume.selected)?resume.selected:null,typed:String(resume.typed||'').slice(0,500),graded:resume.graded?{correct:!!resume.graded.correct,note:String(resume.graded.note||'').slice(0,500)}:null};rr.drills=Number(input.drills)||0;rr.answerCount=Number(input.answerCount)||0;rr.correctCount=Number(input.correctCount)||0;for(let [id,card] of Object.entries(input.reviews)){if((id.startsWith('c-')?rr.custom[id]:findWordForLang(id,l))&&card&&Number.isFinite(Number(card.due))){rr.reviews[id]={due:Number(card.due),interval:Number(card.interval)||0,ease:Number(card.ease)||2.5,reps:Number(card.reps)||0,last:card.last||null};}}clean.langs[l]=rr;}stopAudio();stopMic();ui.lesson=null;state=clean;save();ui.page='dashboard';render();toast('Backup restored. Your progress is back!');}catch{toast('This does not look like a valid Lumi progress backup.');}};reader.readAsText(file);}
function findWordForLang(id,l){return findWord(id,l);}

function routine(){let {focus,mins,alloc}=dailyAllocation();return head('YOUR MULTILINGUAL SYSTEM','One plan. Three languages.',`A ${mins}-minute rotation with half your time in the focus language and the rest in the other two.`)+`<div class="card v2-card" style="margin-bottom:16px"><label for="studyMinutes">Daily study time</label> <select class="select" id="studyMinutes">${[15,30,45,60,90].map(n=>`<option value="${n}" ${n===mins?'selected':''}>${n} minutes</option>`).join('')}</select><p>Choose a sustainable duration. Your selection is saved.</p></div><div class="v2-banner"><div><strong>Focus today: ${LANGS[focus].flag} ${LANGS[focus].name}</strong><p>Pick your focus using the language tabs. Rotate it tomorrow; keep the other languages active.</p></div>${languageTabs()}</div><div class="v2-grid">${LANG_KEYS.map(l=>{let r=state.langs[l],done=Object.values(r.completed).filter(Boolean).length,due=Object.values(r.reviews).filter(x=>x.due<=Date.now()).length;return `<div class="card v2-card"><div class="eyebrow">${alloc[l]} MIN · ${l===focus?'FOCUS':'MAINTENANCE'}</div><h2>${LANGS[l].flag} ${LANGS[l].name}</h2><p>${r.activity[dkey()]||0} XP today · ${done}/${LANGS[l].units.length} units passed · ${due} cards due</p><div class="progress-bar"><span style="width:${done/LANGS[l].units.length*100}%"></span></div><p>${l===focus?'Study one concept, practice recall, then say or write your own sentences.':'Review due cards and recall a few phrases aloud without looking.'}</p><div class="button-row">${launch(l,'learn','Course')}${launch(l,'review','Review')}${launch(l,'drill','Practice')}${launch(l,'journal','Write')}</div></div>`}).join('')}</div><div class="card v2-card" style="margin-top:20px"><h2>How to study for durable fluency</h2><p><strong>First:</strong> learn the pattern and examples. <strong>Next:</strong> retrieve them without looking. <strong>Then:</strong> use them in your own spoken or written sentences. Review your mistakes tomorrow, and add authentic reading and function sounds(){let ar=state.lang==='ar';return v2head('PRONUNCIATION FOUNDATIONS','Sounds & script','Understand the sound system before memorizing hundreds of words.')+`<div class="card v2-card"><h2>${current().name} sound guide</h2><p>${e(ref().intro)}</p><p>Listen, repeat slowly, then repeat at natural speed. Browser voices are synthetic, not a human pronunciation assessment.</p></div>${ar?`<div class="section-line"><h2>The Arabic alphabet · 28 letters</h2></div><div class="card v2-card"><p>Arabic reads right to left. Most letters join both sides; ا د ذ ر ز و do not join to the following letter on the left. The examples show how connecting strokes change the shape of a letter where joining is possible.</p><div class="letter-grid">${alphabet.map((a,i)=>`<button class="letter" data-action="speak" data-text="${letterNames[i]}" aria-label="Hear ${names[i]}"><strong lang="ar" dir="rtl">${a}</strong><span>${names[i]}</span><span lang="ar" dir="rtl">${['ا','د','ذ','ر','ز','و'].includes(a)?'ب'+a+' ب': 'ب'+a+'ب'}</span></button>`).join('')}</div><p>Examples: ب (isolated), بـ (initial), ـبـ (medial), ـب (final). Hamza (ء), tāʾ marbūṭa (ة) and alif maqṣūra (ى) are additional orthographic forms to learn.</p></div>`:''}<div class="section-line"><h2>Sound contrasts and reading rules</h2></div><div class="v2-grid">${ref().sounds.map(([name,example,ex])=>`<article class="card v2-card"><h2>${e(name)}</h2><div class="v2-example">${target(example)}</div><p>${e(ex)}</p><div class="button-row">${playButton(example,'Listen')}<button class="btn btn-ghost btn-small" data-action="v2-slow" data-text="${e(example)}">Slow audio</button></div></article>`).join('')}</div><div class="button-row" style="margin-top:20px"><button class="btn btn-primary" data-action="v2-sound-done">Mark as practiced</button><span class="metric-note">${record().skills.sounds===dkey()?'Practiced today':'Try recording yourself separately and comparing with a fluent speaker.'}</span></div>`;}
